html{background:var(--void);color:var(--mist);font:400 14px/1.5 var(--sans);font-feature-settings:"cv01","ss03","zero";-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;scrollbar-color:var(--graphite) var(--void)}
body{margin:0;font-variant-numeric:tabular-nums}
::selection{background:rgba(99,102,241,.4);color:var(--paper)}
a{color:var(--mist);text-decoration:none} a:hover{color:var(--paper)}
:focus-visible{outline:1.5px solid var(--mist);outline-offset:2px;border-radius:4px}
button{font:inherit;color:inherit}
.mono{font-family:var(--mono);letter-spacing:-.013em}
.fog{color:var(--fog)} .ash{color:var(--ash)}
h1,h2,h3{font-weight:510;color:var(--paper);margin:0;letter-spacing:-.011em}
h2{font-size:13px;color:var(--mist);display:flex;gap:8px;align-items:center;margin:0 0 8px}
h2 .ct{font:400 12px var(--mono);color:var(--fog)}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:6px;border:1px solid var(--graphite);background:transparent;color:var(--mist);font-size:13px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--wash);color:var(--paper)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--lime);color:var(--void);border-color:var(--lime);font-weight:510;height:34px;padding:0 16px;box-shadow:rgba(0,0,0,.07) 0 1px 1px,rgba(0,0,0,.08) 0 0 1px}
.btn.primary:hover{background:#eef75a}
.icon-btn{width:30px;height:30px;display:grid;place-items:center;border-radius:6px;border:1px solid var(--graphite);background:transparent;color:var(--mist);cursor:pointer;flex:none}
.icon-btn:hover{background:var(--wash);color:var(--paper)} .icon-btn:disabled{opacity:.35;cursor:default;background:none}
.linkbtn{background:none;border:0;padding:0;color:var(--fog);cursor:pointer;font-size:12px}
.linkbtn:hover{color:var(--paper)}

/* shell */
.app{display:grid;grid-template-columns:1fr;min-height:100dvh}
.side{display:none}
.topbar{position:sticky;top:0;z-index:6;background:rgba(8,9,10,.92);backdrop-filter:blur(8px);border-bottom:.5px solid var(--graphite)}
.topbar-in{display:flex;align-items:center;gap:10px;height:48px;padding:0 16px}
.topbar h1{font-size:14px}
.topbar .sub{font-size:12px;color:var(--fog)}
.topbar .right{margin-left:auto;display:flex;gap:6px}
.ptabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:0 16px 10px}
.ptab{height:28px;padding:0 10px;border-radius:9999px;background:var(--wash);color:var(--mist);font-size:12px;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.ptab[aria-current=page]{background:var(--paper);color:var(--void);font-weight:510}
.cnt{font:400 11px var(--mono);min-width:16px;height:16px;padding:0 4px;border-radius:4px;display:inline-grid;place-items:center;background:var(--red);color:#fff}
.cnt.z{background:var(--graphite);color:var(--fog)}
.ptab[aria-current=page] .cnt.z{background:#d5d7db;color:var(--void)}
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:var(--carbon);border-top:.5px solid var(--graphite);padding-bottom:env(safe-area-inset-bottom)}
.bottombar button{flex:1;background:none;border:0;padding:8px 0 10px;font-size:11px;color:var(--fog);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.bottombar button[aria-current=page]{color:var(--paper)}
main{padding:0 16px 96px;min-width:0}
@media (min-width:900px){
  .app{grid-template-columns:232px 1fr}
  .side{display:flex;flex-direction:column;gap:2px;padding:12px 10px;background:var(--carbon);border-right:.5px solid var(--graphite);position:sticky;top:0;height:100dvh}
  .side .brand{display:flex;gap:8px;align-items:center;color:var(--paper);font-weight:510;font-size:14px;padding:6px 8px 14px}
  .side .grp{font-size:11px;color:var(--ash);padding:14px 8px 4px;font-weight:510}
  .nav{display:flex;align-items:center;gap:9px;height:30px;padding:0 8px;border-radius:6px;color:var(--mist);font-size:13px;background:none;border:0;cursor:pointer;width:100%;text-align:left}
  .nav:hover{background:var(--wash)}
  .nav[aria-current=page]{background:var(--obsidian);color:var(--paper)}
  .nav .cnt{margin-left:auto}
  .nav svg{color:var(--fog);flex:none}
  .side .foot{margin-top:auto;font-size:11px;color:var(--ash);padding:8px}
  .ptabs,.bottombar,.topbar .brand-m{display:none}
  main{padding:0 32px 48px}
  .topbar-in{padding:0 32px}
}

/* status */
.status{margin:16px 0 4px;max-width:78ch;color:var(--mist);font-size:14px}
.status b{color:var(--paper);font-weight:510}
.meta-line{font:12px var(--mono);color:var(--ash);margin:0 0 4px}
.meta-line.paused{color:var(--orange)}
.banner{margin:12px 0 0;padding:8px 12px;border-radius:6px;background:var(--wash2);box-shadow:inset 0 0 0 1px var(--graphite);font-size:13px}
.banner.warn{box-shadow:inset 0 0 0 1px rgba(242,153,74,.5)} .banner.stop{box-shadow:inset 0 0 0 1px rgba(235,87,87,.55)}

/* home grid */
.home{display:grid;gap:24px;grid-template-columns:1fr;margin-top:16px}
.home>*{min-width:0}
@media (min-width:1100px){.home{grid-template-columns:minmax(320px,380px) 1fr}.inbox{position:sticky;top:64px;align-self:start}}
.panel{background:var(--carbon);border-radius:12px;box-shadow:var(--shadow,inset 0 0 0 1px var(--graphite));padding:6px 0}
.panel-h{display:flex;align-items:center;gap:8px;padding:10px 14px 6px}
.panel-h h2{margin:0}
.cards{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:1400px){.cards{grid-template-columns:1fr 1fr}}
.section-h{display:flex;align-items:center;gap:8px;margin:0 0 10px}
.section-h .fog{font-size:12px}

/* inbox rows */
.ib{border-top:.5px solid var(--graphite)}
.ib:first-of-type{border-top:0}
.ib-row{display:flex;gap:10px;align-items:flex-start;width:100%;padding:10px 14px;background:none;border:0;text-align:left;cursor:pointer}
.ib-row:hover{background:var(--wash2)}
.ib.open .ib-row{background:var(--wash2)}
.ib-row .t{color:var(--paper);font-weight:510;font-size:13px;line-height:1.35}
.ib-row .s{font-size:12px;color:var(--fog);line-height:1.4}
.ib-row .when{margin-left:auto;font:11px var(--mono);color:var(--ash);white-space:nowrap;padding-top:2px}
.ib.done .t{color:var(--fog);font-weight:400}
.ib-body{padding:2px 14px 14px 40px}
.ctx{margin:0 0 10px;font-size:13px;color:var(--mist)}
.ctx a{color:var(--fog);text-decoration:underline;text-underline-offset:3px}
.opts{display:grid;gap:4px;margin:0 0 10px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:6px;background:var(--wash2);box-shadow:inset 0 0 0 1px var(--line);cursor:pointer;font-size:13px;color:var(--mist)}
.opt:hover{background:var(--wash)}
.opt input{appearance:none;width:14px;height:14px;margin:2px 0 0;border-radius:50%;border:1.5px solid var(--fog);display:grid;place-items:center;flex:none}
.opt input:checked{border-color:var(--paper)} .opt input:checked::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--paper)}
.opt:has(input:checked){box-shadow:inset 0 0 0 1px var(--mist);color:var(--paper)}
.why{font-size:12px;color:var(--fog);margin:0 0 10px}
textarea{font:inherit;font-size:13px;width:100%;min-height:56px;padding:9px 12px;border-radius:6px;border:1px solid var(--line);background:var(--wash2);color:var(--mist);resize:vertical}
textarea:focus{outline:none;border-color:var(--mist)}
textarea::placeholder{color:var(--ash)}
.form-foot{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap}
.ok{font-size:12px;color:var(--green)} .err{font-size:12px;color:var(--red)}
.applied{font-size:12px;color:var(--fog);background:var(--wash2);border-radius:6px;padding:7px 10px;margin:0 0 10px;box-shadow:inset 0 0 0 1px var(--line)}
.empty{padding:18px 14px;font-size:13px;color:var(--fog)}
.sum{padding:10px 14px 4px;font-size:12px;color:var(--fog);display:grid;gap:3px;border-top:.5px solid var(--graphite)}
ol.next{margin:0;padding:4px 14px 10px 32px;font-size:13px;color:var(--mist)} ol.next li{padding:3px 0}

/* badges, icons */
.badge{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 6px;border-radius:4px;background:var(--wash);color:var(--fog);font-size:12px;white-space:nowrap}
.badge.rec{color:var(--green);background:rgba(39,166,68,.12)}
.health{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--mist);white-space:nowrap}
.health svg{flex:none}
.agent{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 6px 0 4px;border-radius:9999px;background:var(--wash);font:11px var(--mono);color:var(--mist);white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--fog)}
.d-running{background:var(--green)} .d-waiting{background:var(--iris)} .d-failed{background:var(--red)} .d-quota{background:var(--orange)} .d-done{background:var(--ash)}
.prio{width:16px;height:16px;flex:none;margin-top:1px}

/* project card */
.card{background:var(--carbon);border-radius:12px;box-shadow:inset 0 0 0 1px var(--graphite);padding:14px 16px 12px;min-width:0;cursor:pointer;transition:box-shadow .15s}
.card:hover{box-shadow:inset 0 0 0 1px var(--smoke)}
.card-h{display:flex;align-items:center;gap:10px}
.card-h .nm{color:var(--paper);font-weight:510;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-h .right{margin-left:auto;display:flex;align-items:center;gap:8px;font:12px var(--mono);color:var(--mist)}
.card-meta{display:flex;align-items:center;gap:6px 12px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--fog)}
.card-meta .sep{width:1px;height:12px;background:var(--graphite)}
.upd{margin-top:10px;font-size:12px;color:var(--fog);display:flex;gap:6px;align-items:baseline}
.upd .txt{color:var(--mist);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
/* milestone track */
.ms{position:relative;height:34px;margin:14px 6px 0}
.ms .base{position:absolute;left:0;right:0;top:15px;height:2px;background:var(--graphite);border-radius:2px}
.ms .done{position:absolute;left:0;top:15px;height:2px;background:var(--iris);border-radius:2px}
.ms .today{position:absolute;top:6px;width:1px;height:20px;background:var(--fog)}
.ms .today::after{content:"today";position:absolute;top:-12px;left:50%;transform:translateX(-50%);font:10px var(--mono);color:var(--ash)}
.ms .dm{position:absolute;top:10px;width:12px;height:12px;transform:translateX(-50%)}
.ms .dm i{display:block;width:9px;height:9px;margin:1.5px;transform:rotate(45deg);border-radius:2px;background:var(--void);box-shadow:inset 0 0 0 1.5px var(--fog)}
.ms .dm.full i{background:var(--iris);box-shadow:none}
.ms .dm.part i{background:linear-gradient(135deg,var(--iris) 50%,var(--void) 50%);box-shadow:inset 0 0 0 1.5px var(--iris)}
.ms .dm span{position:absolute;top:18px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--fog);white-space:nowrap}
.ms .who{position:absolute;top:-2px;transform:translateX(-50%);display:flex;gap:2px}
.ms-l{height:16px}
/* loop compact */
.gauge{position:relative;height:6px;border-radius:3px;background:var(--graphite);margin:14px 0 6px;overflow:hidden}
.gauge i{position:absolute;inset:0 auto 0 0;background:var(--iris);border-radius:3px}
.gauge-l{display:flex;justify-content:space-between;font:11px var(--mono);color:var(--ash)}
.marks{display:flex;gap:3px;align-items:center;margin-top:10px;flex-wrap:wrap}
.marks i{width:9px;height:9px;border-radius:2px;background:var(--graphite)}
.marks i.k{background:var(--iris)}
.marks .now{display:inline-flex;gap:6px;align-items:center;margin-left:8px;font-size:12px;color:var(--mist)}
svg.chart{width:100%;height:auto;display:block;margin-top:10px;overflow:visible}
svg.chart text{font-family:var(--mono);font-size:10px;fill:var(--ash)}
svg.chart text.v{fill:var(--paper)}
.key{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:6px;font-size:12px;color:var(--fog)}
.key i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:0}
.key i.kept{background:var(--iris)} .key i.disc{box-shadow:inset 0 0 0 1.3px var(--fog)} .key i.run{box-shadow:inset 0 0 0 1.5px var(--green)}
.key i.sq{border-radius:2px} .key i.line{width:12px;height:2px;border-radius:1px;vertical-align:3px}
.bd-bar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--graphite);margin:8px 0 6px}
.bd-bar i{display:block;height:100%}
.bd-bar .m{background:var(--iris)} .bd-bar .r{background:var(--lav);opacity:.75} .bd-bar .x{background:var(--red)}
.bd-l{display:flex;flex-wrap:wrap;gap:3px 12px;font-size:12px;color:var(--fog)}
.bd-l b{color:var(--mist);font-weight:510}
.bd-l i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
.bd-two{display:grid;gap:18px;grid-template-columns:1fr}
@container drawer (min-width:560px){.bd-two{grid-template-columns:1fr 1fr}}
.bd-big .t{font-size:13px;color:var(--mist)}
.bd-big .pct{font:510 32px/1.1 var(--sans);letter-spacing:-.022em;color:var(--paper);margin:6px 0 2px}
.bd-big .pct small{font:400 13px var(--mono);color:var(--fog);margin-left:8px;letter-spacing:0}
.ib.kfocus .ib-row{background:var(--wash)}
.tbl td.num{white-space:nowrap}
.hint{font-size:11px;color:var(--ash);display:flex;gap:4px;align-items:center}
@media (max-width:1099px){.hint{display:none}}
@media (max-width:720px){.agent,.ib-row .when,.gauge-l,.meta-line,.kbd{font-size:12px}}

/* all view rows */
.grp-h{display:flex;align-items:center;gap:10px;margin:22px 0 6px;padding:0 4px}
.grp-h h2{margin:0;font-size:13px;color:var(--paper)}
.list{background:var(--carbon);border-radius:12px;box-shadow:inset 0 0 0 1px var(--graphite);overflow:hidden}
.lrow{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 14px;border-top:.5px solid var(--graphite);color:var(--mist)}
.lrow:first-child{border-top:0}
.lrow:hover{background:var(--wash2);color:var(--paper)}
.lrow .nm{color:var(--paper);font-weight:510;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .r{display:flex;gap:10px;align-items:center;font:12px var(--mono)}
.lrow .sub{grid-column:2/4;display:flex;gap:6px 12px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--fog)}
@media (min-width:900px){.lrow{grid-template-columns:18px minmax(0,1.3fr) 130px minmax(0,1.6fr) 170px}.lrow .sub{grid-column:auto}}
.lrow .date{font:12px var(--mono);color:var(--fog);text-align:right;white-space:nowrap}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-weight:400;font-size:12px;color:var(--fog);padding:8px 10px;border-bottom:.5px solid var(--graphite);white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:.5px solid var(--graphite);vertical-align:top;color:var(--mist)}
.tbl tr:last-child td{border-bottom:0}
.tbl .num{text-align:right}
.tbl .sm{font-size:12px;color:var(--fog)}
@media (max-width:720px){
  .tbl.stack thead{display:none}
  .tbl.stack tr{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 12px;border-bottom:.5px solid var(--graphite)}
  .tbl.stack td{border:0;padding:0}
  .tbl.stack td.full{grid-column:1/-1}
}
.tok-bar{display:flex;height:6px;border-radius:3px;overflow:hidden;margin:10px 0 8px;background:var(--graphite)} .tok-bar span{height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--fog)} .legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}

/* drawer (peek) */
dialog.drawer{position:fixed;inset:8px 8px 8px auto;margin:0;padding:0;height:calc(100dvh - 16px);max-height:none;width:min(920px,calc(100vw - 260px));max-width:calc(100vw - 16px);border:0;border-radius:12px;background:var(--obsidian);color:var(--mist);
  box-shadow:inset 0 0 0 1px var(--smoke),rgba(8,9,10,.6) 0 4px 32px;transform:translateX(calc(100% + 16px));transition:transform .24s cubic-bezier(.2,.9,.25,1),display .24s allow-discrete,overlay .24s allow-discrete;display:none;flex-direction:column;overflow:hidden}
dialog.drawer[open]{display:flex;transform:none}
@starting-style{dialog.drawer[open]{transform:translateX(calc(100% + 16px))}}
dialog.drawer::backdrop{background:rgba(8,9,10,0);transition:background .24s,display .24s allow-discrete,overlay .24s allow-discrete}
dialog.drawer[open]::backdrop{background:rgba(8,9,10,.55)}
@starting-style{dialog.drawer[open]::backdrop{background:rgba(8,9,10,0)}}
.dw-bar{display:flex;align-items:center;gap:6px;height:48px;padding:0 12px;border-bottom:.5px solid var(--graphite);flex:none;position:relative}
.dw-bar .crumb{font-size:13px;color:var(--fog);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-left:4px}
.dw-bar .crumb b{color:var(--paper);font-weight:510}
.dw-bar .pos{font:11px var(--mono);color:var(--ash);margin-left:auto;white-space:nowrap}
.kbd{font:11px var(--mono);color:var(--fog);background:var(--wash);border-radius:4px;padding:1px 5px}
.handle{display:none}
.dw-strip{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:8px 12px;border-bottom:.5px solid var(--graphite);flex:none}
.dw-strip a{height:26px;padding:0 10px;border-radius:9999px;display:inline-flex;gap:6px;align-items:center;font-size:12px;color:var(--fog);white-space:nowrap}
.dw-strip a:hover{background:var(--wash);color:var(--mist)}
.dw-strip a[aria-current=true]{background:var(--wash);color:var(--paper);box-shadow:inset 0 0 0 1px var(--smoke)}
.dw-body{flex:1;overflow:auto;overscroll-behavior:contain;outline:none;container:drawer/inline-size}
.dw-slide{padding:20px 24px 40px;transition:transform .2s cubic-bezier(.2,.9,.25,1),opacity .2s}
.dw-slide.from-r{transform:translateX(28px);opacity:0} .dw-slide.from-l{transform:translateX(-28px);opacity:0}
.pp-title{font-size:20px;font-weight:510;letter-spacing:-.012em;color:var(--paper);margin:6px 0 2px}
.props{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 4px}
.prop{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px;border-radius:6px;background:var(--wash2);box-shadow:inset 0 0 0 1px var(--line);font-size:12px;color:var(--mist);white-space:nowrap}
.prop .k{color:var(--ash)}
.pp-grid{display:grid;gap:20px;grid-template-columns:1fr;margin-top:18px}
.pp-grid>*{min-width:0}
@container drawer (min-width:800px){.pp-grid{grid-template-columns:1fr 300px}}
.box{background:var(--carbon);border-radius:12px;box-shadow:inset 0 0 0 1px var(--graphite);padding:14px 16px;margin-bottom:16px}
.box > h2{margin-bottom:10px}
.update{padding:12px 0;border-top:.5px solid var(--graphite)} .update:first-of-type{border-top:0;padding-top:2px}
.update .hd{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--fog)}
.update p{margin:6px 0 0;font-size:13px;color:var(--mist)}
.missed{font-size:12px;color:var(--orange)}
.mrow{display:grid;grid-template-columns:14px 1fr auto auto;gap:10px;align-items:center;padding:8px 0;border-top:.5px solid var(--graphite);font-size:13px}
.mrow:first-of-type{border-top:0}
.mrow .dmi{width:9px;height:9px;transform:rotate(45deg);border-radius:2px;box-shadow:inset 0 0 0 1.5px var(--fog)}
.mrow .dmi.full{background:var(--iris);box-shadow:none}
.mrow .dmi.part{background:linear-gradient(135deg,var(--iris) 50%,transparent 50%);box-shadow:inset 0 0 0 1.5px var(--iris)}
.side-list .it{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-top:.5px solid var(--graphite);font-size:13px}
.side-list .it:first-of-type{border-top:0}
.dw-hint{font-size:11px;color:var(--ash);margin:18px 0 0}
@media (max-width:720px){
  dialog.drawer{inset:auto 0 0 0;width:100vw;max-width:100vw;height:93dvh;border-radius:12px 12px 0 0;transform:translateY(100%)}
  @starting-style{dialog.drawer[open]{transform:translateY(100%)}}

}
const health=h=>`<span class="health">${healthIcon(h)}${HL[h][0]}</span>`;
function pie(pct,size=14){const r=4.5,c=2*Math.PI*r;return `<svg width="${size}" height="${size}" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="6" fill="none" stroke="var(--smoke)" stroke-width="1.5"/><circle cx="7" cy="7" r="${r/2}" fill="none" stroke="var(--iris)" stroke-width="${r}" stroke-dasharray="${c/2*Math.min(1,pct/100)} ${c}" transform="rotate(-90 7 7)"/></svg>`}
function kindIcon(k){
  if(k==="build")return `<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="1.5" width="13" height="13" rx="3.5" fill="none" stroke="var(--iris)" stroke-width="1.4"/><path d="M5 10.5l2-2 1.6 1.4L11 6" fill="none" stroke="var(--iris)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  if(k==="loop")return `<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="1.5" width="13" height="13" rx="3.5" fill="none" stroke="var(--lav)" stroke-width="1.4"/><path d="M10.6 6.2A3 3 0 1 0 11 8.4" fill="none" stroke="var(--lav)" stroke-width="1.4" stroke-linecap="round"/><path d="M10.9 4.4v2.1H8.8" fill="none" stroke="var(--lav)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  return `<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="1.5" width="13" height="13" rx="3.5" fill="none" stroke="var(--teal)" stroke-width="1.4"/><path d="M5 6h6M5 8.5h6M5 11h3.5" stroke="var(--teal)" stroke-width="1.4" stroke-linecap="round"/></svg>`;
}
function leverIcon(k){
  if(k==="urgent")return `<svg class="prio" viewBox="0 0 16 16" aria-label="Needs you"><rect x="1" y="1" width="14" height="14" rx="3.5" fill="var(--red)"/><path d="M8 4.5v4.3" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/><circle cx="8" cy="11.2" r="1" fill="#fff"/></svg>`;
  if(k==="action")return `<svg class="prio" viewBox="0 0 16 16" aria-label="Action for you"><circle cx="8" cy="8" r="6.2" fill="none" stroke="var(--mist)" stroke-width="1.5"/><circle cx="8" cy="8" r="2.2" fill="var(--mist)"/></svg>`;
  return `<svg class="prio" viewBox="0 0 16 16" aria-label="Applied by default"><circle cx="8" cy="8" r="6.2" fill="none" stroke="var(--fog)" stroke-width="1.5" stroke-dasharray="2.4 2"/><path d="M5.4 8.2l1.7 1.7 3.5-3.6" fill="none" stroke="var(--fog)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
const agentChip=a=>`<span class="agent" title="${a.hc} ${esc(a.who)} · ${esc(a.provider)} ${esc(a.model)}: ${ST[a.state]}"><i class="dot d-${a.state}"></i>${a.hc}</span>`;
const chips=p=>agentsOf(p).filter(a=>a.state!=="done").map(agentChip).join("");
const leverCount=p=>{const n=openLevers("all").filter(l=>l.project===p.id).length;return n?`<span class="cnt" title="${n} waiting on you">${n}</span>`:""};
const targetOf=(p,s)=>p.kind==="build"?"due "+md(s.lastDue):p.kind==="loop"?"target "+fmtV(p.target,p.unit):"oldest "+s.oldest+"d (limit "+RUN_MAX_AGE+"d)";
function breakdown(b,big){
  const w=v=>100*v/b.total;
  const bar=`<div class="bd-bar" role="img" aria-label="${b.merged} merged, ${b.inPR} in PR, ${b.blocked} blocked, ${b.todo} to do of ${b.total}"><i class="m" style="width:${w(b.merged)}%"></i><i class="r" style="width:${w(b.inPR)}%"></i><i class="x" style="width:${w(b.blocked)}%"></i></div>`;
  const leg=`<div class="bd-l"><span><i style="background:var(--iris)"></i><b>${b.merged}</b> merged</span><span><i style="background:var(--lav);opacity:.75"></i><b>${b.inPR}</b> in PR</span><span><i style="background:var(--red)"></i><b>${b.blocked}</b> blocked</span><span><i style="background:var(--graphite)"></i><b>${b.todo}</b> to do <span class="ash">of ${b.total}</span></span></div>`;
  return big?`<div class="bd-big"><div class="t">${esc(b.name)}</div><div class="pct">${b.pct}%<small>merged</small></div>${bar}${leg}</div>`:bar+leg;
}

/* ---------- charts ---------- */
function projectGraph(p,s){
  const W=narrow()?340:640,H=narrow()?170:200,L=narrow()?6:30,R=12,T=18,B=26;
  const end=new Date(Math.max(s.predicted,s.end)+3*DAY),span=(end-s.start)/DAY;
  const X=d=>L+(W-L-R)*((d-s.start)/DAY)/span,Y=v=>T+(H-T-B)*(1-v/(s.t*1.08));
  const sc=s.series.map((v,i)=>`${X(new Date(s.start.getTime()+i*DAY))},${Y(v[0])}`).join(" ");
  const cp=s.series.map((v,i)=>`${X(new Date(s.start.getTime()+i*DAY))},${Y(v[1])}`).join(" ");
  let g=`<line x1="${L}" x2="${W-R}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--graphite)"/>`;
  for(let d=new Date(s.start);d<=end;d=new Date(d.getTime()+(narrow()?14:7)*DAY))g+=`<text x="${X(d)}" y="${H-8}" text-anchor="middle">${md(d)}</text>`;
  g+=`<line x1="${X(s.end)}" x2="${X(s.end)}" y1="${T}" y2="${Y(0)}" stroke="var(--smoke)" stroke-dasharray="3 3"/><text x="${X(s.end)+4}" y="${T-4}">due ${md(s.lastDue)}</text>`;
  g+=`<line x1="${X(NOW)}" x2="${X(NOW)}" y1="${T}" y2="${Y(0)}" stroke="var(--fog)"/><text x="${X(NOW)-4}" y="${T-4}" text-anchor="end">today</text>`;
  g+=`<polyline points="${sc}" fill="none" stroke="var(--fog)" stroke-width="1.5"/><polyline points="${X(NOW)},${Y(s.t)} ${X(end)},${Y(s.t)}" fill="none" stroke="var(--fog)" stroke-width="1.5" stroke-dasharray="3 3"/>`;
  g+=`<polygon points="${X(s.start)},${Y(0)} ${cp} ${X(NOW)},${Y(0)}" fill="rgba(99,102,241,.14)"/><polyline points="${cp}" fill="none" stroke="var(--iris)" stroke-width="2"/>`;
  g+=`<line x1="${X(NOW)}" y1="${Y(s.d)}" x2="${X(s.predicted)}" y2="${Y(s.t)}" stroke="var(--iris)" stroke-width="1.5" stroke-dasharray="4 3"/><circle cx="${X(s.predicted)}" cy="${Y(s.t)}" r="3.5" fill="var(--iris)"/>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Scope ${s.t} units, ${s.d} merged, predicted finish ${md(s.predicted)}">${g}</svg>
   <div class="key"><span><i class="line" style="background:var(--fog)"></i>Scope ${s.t} (+${p.added} since start)</span><span><i class="line" style="background:var(--iris)"></i>Merged ${s.d}</span><span><i class="line" style="background:repeating-linear-gradient(90deg,var(--iris) 0 3px,transparent 3px 5px)"></i>Forecast at ${s.vel.toFixed(1)} units/day</span></div>
   <p style="margin:8px 0 0;font-size:13px;color:${s.slip>0?"var(--orange)":"var(--green)"}">Predicted finish ${md(s.predicted)}: ${s.slip>0?s.slip+" day"+(s.slip>1?"s":"")+" after the "+md(s.lastDue)+" due date":"on or before the due date"}.</p>`;
}
function loopChart(p,big){
  const W=big&&!narrow()?640:320,H=big&&!narrow()?190:110,lo=Math.min(p.baseline,...p.exps.map(e=>e[1]))*.985,hi=p.target*1.02;
  const n=p.exps.length+(p.running?1:0),x=i=>12+i*(W-60)/Math.max(1,n-1),y=v=>H-14-(v-lo)/(hi-lo)*(H-26);
  let best=p.exps[0][1];const pts=p.exps.map((e,i)=>{if(e[2])best=Math.max(best,e[1]);return x(i)+","+y(best)});
  const endX=p.running?x(n-1):x(p.exps.length-1);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(p.metric)}: best ${fmtV(best,p.unit)}, target ${fmtV(p.target,p.unit)}">
   <line x1="0" x2="${W}" y1="${y(p.target)}" y2="${y(p.target)}" stroke="var(--green)" stroke-dasharray="3 3" opacity=".7"/><text x="${W}" y="${y(p.target)-5}" text-anchor="end">target ${fmtV(p.target,p.unit)}</text>
   <polyline fill="none" stroke="var(--iris)" stroke-width="2" points="${pts.join(" ")}"/>
   ${p.exps.map((e,i)=>`<circle cx="${x(i)}" cy="${y(e[1])}" r="${big?4:3}" fill="${e[2]?"var(--iris)":"var(--obsidian)"}" stroke="${e[2]?"var(--iris)":"var(--fog)"}" stroke-width="1.3"><title>#${i} ${esc(e[0])}: ${fmtV(e[1],p.unit)} ${e[2]?"kept":"discarded"}</title></circle>`).join("")}
   ${p.running?`<circle cx="${x(n-1)}" cy="${y(best)}" r="4.5" fill="none" stroke="var(--green)" stroke-width="1.5"><title>Running: ${esc(p.running)}</title></circle>`:""}
   <text class="v" x="${endX+8}" y="${y(best)+4}">${fmtV(best,p.unit)}</text></svg>
   <div class="key"><span><i class="line" style="background:var(--iris)"></i>best kept so far</span><span><i class="kept"></i>kept</span><span><i class="disc"></i>discarded</span>${p.running?`<span><i class="run"></i>running #${p.exps.length}</span>`:""}</div>`;
}
function cycleGraph(p,big){
  const W=big&&!narrow()?640:320,H=big&&!narrow()?170:96,n=p.daily.length,max=Math.max(...p.daily.map(d=>d[0]))*1.1;
  const x=i=>8+i*(W-58)/(n-1),y=v=>H-16-(v/max)*(H-24);
  const sc=p.daily.map((d,i)=>x(i)+","+y(d[0])).join(" "),cp=p.daily.map((d,i)=>x(i)+","+y(d[1])).join(" ");
  const [in1,cl1]=p.daily.at(-1),[in0,cl0]=p.daily[0],g0=in0-cl0,g1=in1-cl1,ex=x(n-1)+8;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Last 14 days: ${in1} came in, ${cl1} closed, ${g1} open">
   <line x1="8" x2="${x(n-1)}" y1="${y(0)}" y2="${y(0)}" stroke="var(--graphite)"/>
   <polyline points="${sc}" fill="none" stroke="var(--fog)" stroke-width="1.5"/>
   <polygon points="${x(0)},${y(0)} ${cp} ${x(n-1)},${y(0)}" fill="rgba(2,184,204,.12)"/><polyline points="${cp}" fill="none" stroke="var(--teal)" stroke-width="2"/>
   <line x1="${ex}" x2="${ex}" y1="${y(in1)}" y2="${y(cl1)}" stroke="var(--orange)" stroke-width="1.5"/><text x="${ex+5}" y="${(y(in1)+y(cl1))/2+3}" style="fill:var(--orange)">${g1} open</text>
   <text x="8" y="${H-2}">14 days ago</text><text x="${x(n-1)}" y="${H-2}" text-anchor="end">today</text></svg>
   <div class="key"><span><i class="line" style="background:var(--fog)"></i>came in ${big?`${in0} → `:""}${in1}</span><span><i class="line" style="background:var(--teal)"></i>closed ${big?`${cl0} → `:""}${cl1}</span><span style="color:var(--mist)">${g1<g0?"queue shrinking":g1>g0?"queue growing":"queue steady"} (${g0} → ${g1} open)</span></div>`;
}
function milestones(p,s){
  const span=s.end-s.start,X=d=>Math.max(0,Math.min(100,100*(d-s.start)/span));
  const donePct=X(new Date(s.start.getTime()+span*s.d/s.t));
  return `<div class="ms" role="img" aria-label="Milestones"><span class="base"></span><span class="done" style="width:${donePct}%"></span><span class="today" style="left:${X(NOW)}%"></span>
   ${(()=>{let prev=-99;return p.phases.map(([n,d,t,,b],i,arr)=>{const st=d>=t?"full":d>0?"part":"";const at=X(new Date(D(b).getTime()+DAY));const last=i===arr.length-1;
     const lastAt=X(new Date(D(arr.at(-1)[4]).getTime()+DAY));const cur=p.phases.findIndex(x=>x[1]<x[2]);const room=last||(i===cur&&lastAt-at>=22);const lab=room?`<span style="${last?"left:auto;right:-4px;transform:none":""}">${esc(n)}</span>`:"";
     return `<span class="dm ${st}" style="left:${at}%" title="${esc(n)}: ${d}/${t} · due ${md(D(b))}"><i></i>${lab}</span>`}).join("")})()}</div><div class="ms-l"></div>`;
}

/* ---------- blocks ---------- */
function card(p){
  const s=stats(p);let body="";
  if(p.kind==="build")body=breakdown(s.scopes[0],false)+milestones(p,s);
  else if(p.kind==="loop"){const ex=expandedLoops.has(p.id);
    body=ex?loopChart(p,false):`<div class="gauge"><i style="width:${Math.max(2,Math.min(100,s.pct))}%"></i></div><div class="gauge-l"><span>baseline ${fmtV(p.baseline,p.unit)}</span><span>${s.pct}% of the way</span><span>target ${fmtV(p.target,p.unit)}</span></div>
      <div class="marks">${p.exps.slice(1).slice(-14).map(e=>`<i class="${e[2]?"k":""}" title="${esc(e[0])}: ${e[2]?"kept":"discarded"}"></i>`).join("")}${p.running?`<span class="now"><i class="dot d-running"></i>#${p.exps.length} ${esc(p.running)}</span>`:""}</div><div class="key"><span><i class="kept sq"></i>kept</span><span><i class="disc sq"></i>discarded</span><span>last ${Math.min(14,p.exps.length-1)} runs</span></div>`;
    body+=`<div class="card-meta"><span>${esc(p.metric)}</span><span class="sep"></span><span>${p.exps.length-1} runs · ${s.kept} kept</span><button class="linkbtn" data-loop="${p.id}">${ex?"Compact":"Show chart"}</button></div>`}
  else body=cycleGraph(p,false);
  const right=p.kind==="build"?`${pie(s.pct)}${s.pct}%`:p.kind==="loop"?`<span style="color:var(--paper)">${fmtV(s.best,p.unit)}</span><span class="ash">/ ${fmtV(p.target,p.unit)}</span>`:`${s.open} open`;
  return `<article class="card" data-open="${p.id}" tabindex="0" aria-label="Open ${esc(p.name)}">
   <div class="card-h">${kindIcon(p.kind)}<span class="nm">${esc(p.name)}</span>${leverCount(p)}<span class="right">${right}</span></div>
   ${body}
   <div class="card-meta">${health(s.health)}<span class="sep"></span><span class="mono">${p.kind==="build"?targetOf(p,s)+(s.slip>0?` · <span style="color:var(--orange)">predicted ${md(s.predicted)}</span>`:""):p.kind==="run"?targetOf(p,s):p.feat}</span>${chips(p)?`<span class="sep"></span>${chips(p)}`:""}</div>
   ${s.last?`<div class="upd"><span class="mono">${s.last[1]}</span><span class="txt">${esc(s.last[3])}</span><span class="mono ash">${ago(s.last[0])}</span></div>`:""}</article>`;
}
function leverRow(l){
  const a=answers[l.id],p=proj(l.project),open=openLever===l.id,ro=proto.noKey,chosen=a?.choice??(l.applied?l.reco:null);
  const sub=a?`<span class="ok">Answered · ${esc((l.options.find(o=>o[0]===a.choice)||[,a.choice])[1])}</span>`:`${esc(p.name)} · ${esc(l.short)}`;
  return `<div class="ib ${open?"open":""} ${a?"done":""}" data-id="${l.id}">
   <button class="ib-row" type="button" aria-expanded="${open}" data-lever="${l.id}">${a?leverIcon("applied"):leverIcon(l.kind)}<span style="min-width:0"><span class="t">${esc(l.title)}</span><br><span class="s">${sub}</span></span><span class="when">${a?hm(a.at):ago(l.at)}</span></button>
   ${open?`<form class="ib-body" data-form="${l.id}">${l.applied?`<p class="applied">The agent applied <b style="color:var(--mist);font-weight:510">${esc(l.options.find(o=>o[0]===l.reco)[1])}</b> and kept going. Pick another option to override it.</p>`:""}
    <p class="ctx">${esc(l.context)} <a href="#/p/${p.id}">Open project</a></p>
    <div class="opts" role="radiogroup" aria-label="Options">${l.options.map(([v,t])=>`<label class="opt"><input type="radio" name="c" value="${v}" ${chosen===v?"checked":""} ${ro?"disabled":""}><span>${esc(t)} ${v===l.reco?`<span class="badge rec">Recommended</span>`:""}</span></label>`).join("")}</div>
    ${l.why?`<p class="why">${esc(l.why)}${l.from?` <span class="mono">— ${l.from}</span>`:""}</p>`:""}
    <textarea name="note" placeholder="Anything the agent should know (optional)" ${ro?"disabled":""}>${esc(a?.note||"")}</textarea>
    <div class="form-foot"><button class="btn primary" type="submit" ${ro?"disabled":""}>Save answer</button><span class="msg">${ro?`<span class="err">Read-only: this link has no ?k= key.</span>`:""}</span></div></form>`:""}</div>`;
}
function inbox(prod,withNext=true){
  let list=proto.empty?[]:DATA.levers.filter(l=>prod==="all"||proj(l.project).product===prod);
  const order={urgent:0,action:1,applied:2};
  list.sort((a,b)=>(!!answers[a.id])-(!!answers[b.id])||order[a.kind]-order[b.kind]);
  const n=proto.empty?0:openLevers(prod).length,ag=DATA.agents.filter(a=>prod==="all"||proj(a.project).product===prod),c=k=>ag.filter(a=>a.state===k).length;
  return `<section class="inbox"><div class="panel"><div class="panel-h"><h2>Inbox <span class="ct">${n}</span></h2><span class="hint" style="margin-left:auto"><span class="kbd">j</span><span class="kbd">k</span> move <span class="kbd">1–4</span> pick <span class="kbd">${/Mac|iPhone|iPad/.test(navigator.platform)?"⌘↵":"Ctrl ↵"}</span> save</span></div>
   ${list.length?list.map(leverRow).join(""):`<p class="empty">Nothing waits on you. Agents add questions with <span class="mono">factory ask</span>.</p>`}
   <div class="sum"><span><i class="dot d-running" style="display:inline-block"></i> ${c("running")} running · ${c("waiting")} paused for you · <span style="color:var(--red)">${c("failed")} failed</span> · <span style="color:var(--orange)">${c("quota")} quota</span></span><span>${fmtTok(ag.reduce((s,a)=>s+a.tokens,0))} tokens today · <a href="#/${prod}/agents" style="text-decoration:underline;text-underline-offset:3px">Agents</a></span></div></div>
   ${withNext?`<div class="panel" style="margin-top:12px"><div class="panel-h"><h2>Next, without you</h2></div><ol class="next">${sortProjects(DATA.projects.filter(p=>prod==="all"||p.product===prod)).filter(p=>!isQuiet(p)).slice(0,4).map(p=>`<li>${esc(p.next[0])}</li>`).join("")}</ol></div>`:""}</section>`;
}
function statusLine(keys){
  const sum=k=>{const ps=DATA.projects.filter(p=>p.product===k),h=ps.map(p=>stats(p).health),w=proto.empty?0:openLevers(k).length;
    const parts=[["offTrack","off track"],["atRisk","at risk"],["onTrack","on track"],["stale","no update"]].map(([v,l])=>[h.filter(x=>x===v).length,l]).filter(([c])=>c).map(([c,l])=>c+" "+l);
    return `<span style="display:block"><b>${esc(DATA.products[k].name)}:</b> <b style="color:${w?"var(--paper)":"var(--fog)"}">${w} waiting on you</b> · ${ps.length} project${ps.length>1?"s":""}: ${parts.join(", ")}.</span>`};
  return `${proto.stale?`<div class="banner warn">Data is 47 min old. The build has not run since 13:19 UTC; see <span class="mono">data/factory-build.log</span>.</div>`:""}${proto.noKey?`<div class="banner stop">Signed out: your Cloudflare login expired, so answers cannot be saved. Reload the page to sign in again.</div>`:""}
   <p class="status">${keys.map(sum).join("")}</p><p class="meta-line ${dirty?"paused":""}" id="refresh"></p>`;
}

/* ---------- views ---------- */
function viewHome(prod){
  if(!expandedLoops){expandedLoops=new Set();Object.keys(DATA.products).forEach(k=>{const l=DATA.projects.filter(p=>p.product===k&&p.kind==="loop"&&!isQuiet(p)).sort((a,b)=>b.lastActive.localeCompare(a.lastActive))[0];if(l)expandedLoops.add(l.id)})}
  const ps=projOrder(prod),live=ps.filter(p=>!isQuiet(p)),quiet=ps.filter(isQuiet);
  return statusLine([prod])+`<div class="home">${inbox(prod)}<section><div class="section-h"><h2 style="margin:0">Projects <span class="ct">${ps.length}</span></h2><span class="fog">Sorted by what needs you</span></div>
   <div class="cards">${live.map(card).join("")}</div>
   ${quiet.length?`<details style="margin-top:12px"><summary class="fog" style="cursor:pointer;font-size:13px;padding:6px 2px">Quiet · ${quiet.length} with no agent and no update for 3 days</summary><div class="cards" style="margin-top:10px">${quiet.map(card).join("")}</div></details>`:""}</section></div>`;
}
function viewAll(){
  return statusLine(Object.keys(DATA.products))+`<div class="home">${inbox("all",false)}<section>${Object.entries(DATA.products).map(([k,pr])=>{
    const ps=projOrder(k),ag=DATA.agents.filter(a=>proj(a.project).product===k);
    return `<div class="grp-h"><h2><a href="#/${k}">${esc(pr.name)}</a></h2><span class="fog" style="font-size:12px">${openLevers(k).length} waiting · ${ag.filter(a=>a.state==="running").length} running · ${fmtTok(ag.reduce((s,a)=>s+a.tokens,0))} tokens</span></div>
     <div class="list">${ps.map(p=>{const s=stats(p),pc=p.kind==="loop"?s.pct:s.pct;
      return `<a class="lrow" href="#/p/${p.id}">${kindIcon(p.kind)}<span class="nm">${esc(p.name)}</span><span class="r">${p.kind==="run"?s.open+" open":pie(pc)+pc+"%"+(p.kind==="loop"?" of the way":"")}</span><span class="sub">${health(s.health)}${leverCount(p)}${chips(p)}</span><span class="date">${esc(targetOf(p,s))}</span></a>`}).join("")}</div>`}).join("")}</section></div>`;
}
function viewProject(id){
  const p=proj(id),s=stats(p),pr=DATA.products[p.product];
  const ups=p.updates||[],lastAge=ups[0]?(NOW-new Date(ups[0][0]))/DAY:99;
  let main="";
  if(p.kind==="build"){
    main=`<div class="box"><h2>Progress</h2><div class="bd-two">${s.scopes.map(b=>breakdown(b,true)).join("")}</div></div>
     <div class="box"><h2>Project graph</h2>${projectGraph(p,s)}</div>
     <div class="box"><h2>Milestones <span class="ct">${p.phases.filter(x=>x[1]>=x[2]).length}/${p.phases.length} done</span><span class="key" style="margin:0 0 0 auto"><span><i class="kept sq" style="transform:rotate(45deg)"></i>done</span><span><i class="disc sq" style="transform:rotate(45deg)"></i>ahead</span></span></h2>${p.phases.map(([n,d,t,a,b])=>`<div class="mrow"><span class="dmi ${d>=t?"full":d>0?"part":""}"></span><span style="color:var(--paper)">${esc(n)}</span><span class="mono fog">${d}/${t}</span><span class="mono ${D(b)<NOW&&d<t?"":"fog"}" style="${D(b)<NOW&&d<t?"color:var(--orange)":""}">${md(D(b))}</span></div>`).join("")}</div>`;
  } else if(p.kind==="loop"){
    main=`<div class="box"><h2>${esc(p.metric)} <span class="ct">best kept per run</span></h2>${loopChart(p,true)}</div>
     <div class="box" style="padding:6px 6px"><table class="tbl"><thead><tr><th>#</th><th>Change</th><th class="num">Result</th><th>Outcome</th></tr></thead><tbody>${
      [...(p.running?[[p.exps.length,p.running,null,"run"]]:[]),...p.exps.map((e,i)=>[i,...e]).reverse()].map(([n,t,v,k])=>`<tr><td class="mono fog">${n}</td><td>${esc(t)}</td><td class="num mono">${v==null?"…":fmtV(v,p.unit)}</td><td>${k==="run"?`<span class="health"><i class="dot d-running"></i>Running</span>`:k?`<span class="badge rec">Kept</span>`:`<span class="badge">Discarded</span>`}</td></tr>`).join("")}</tbody></table></div>`;
  } else {
    main=`<div class="box"><h2>Intake vs closed, last 14 days</h2>${cycleGraph(p,true)}</div>
     <div class="box" style="padding:6px 6px"><table class="tbl"><thead><tr><th>Issue</th><th>Title</th><th>Status</th><th class="num">Age</th></tr></thead><tbody>${p.items.map(i=>`<tr><td class="mono fog">${i[0]}</td><td>${esc(i[1])}</td><td><span class="badge">${esc(i[3])}</span></td><td class="num mono">${Math.floor((NOW-D(i[2]))/DAY)}d</td></tr>`).join("")}</tbody></table></div>`;
  }
  const levers=DATA.levers.filter(l=>l.project===id);
  const why=p.kind==="build"?(s.slip>0?` · predicted ${s.slip} day${s.slip>1?"s":""} late`:" · predicted on time"):p.kind==="loop"&&s.health!=="stale"&&s.last?` · from ${s.last[1]}'s update`:p.kind==="run"?` · oldest item ${s.oldest}d`:"";
  const props=[`<span class="prop">${kindIcon(p.kind)}${p.kind==="run"?"Run lane":p.kind==="loop"?"Loop":"Build"}</span>`,
    `<span class="prop">${healthIcon(s.health)}${HL[s.health][0]}<span class="k">${why}</span></span>`,
    p.kind!=="run"?`<span class="prop">${pie(s.pct)}${s.pct}%${p.kind==="loop"?" of the way":" merged"}</span>`:`<span class="prop">${s.open} open</span>`,
    `<span class="prop">${esc(targetOf(p,s))}</span>`,
    p.prio?`<span class="prop"><span class="k">Priority</span>P${p.prio}</span>`:"",
    `<span class="prop"><span class="k">Roadmap</span><span class="mono">${esc(p.feat)}</span></span>`].join("");
  return `<h3 class="pp-title" id="ppTitle">${esc(p.name)}</h3><div class="props">${props}</div>
   <div class="pp-grid"><div>
    <div class="box"><h2>Latest update ${p.kind!=="run"&&lastAge>3?`<span class="missed">· update missed (${Math.floor(lastAge)} days)</span>`:""}</h2>${ups.length?ups.slice(0,2).map(u=>`<div class="update"><div class="hd">${healthIcon(u[2])}<span><span class="mono">${u[1]}</span> reported <span style="color:var(--mist)">${HL[u[2]][0]}</span></span><span class="mono ash" style="margin-left:auto">${ago(u[0])} ago</span></div><p>${esc(u[3])}</p></div>`).join(""):`<p class="fog" style="font-size:13px;margin:0">Run lanes post no updates; the graph is the update.</p>`}</div>
    ${main}</div>
   <aside>
    ${levers.length?`<div class="panel" style="margin-bottom:16px"><div class="panel-h"><h2>Waiting on you</h2></div>${levers.map(leverRow).join("")}</div>`:""}
    <div class="box side-list"><h2>Agents</h2>${agentsOf(p).length?agentsOf(p).map(a=>`<div class="it">${agentChip(a)}<span style="min-width:0">${esc(a.task)}<div class="fog" style="font-size:12px">${esc(a.provider)} · ${esc(a.model)} · ${fmtTok(a.tokens)}</div></span></div>`).join(""):`<p class="fog" style="font-size:13px;margin:0">No agent on this project.</p>`}</div>
    <div class="box side-list"><h2>Pull requests</h2>${p.prs.length?p.prs.map(n=>{const r=DATA.prs[n];const c={pass:"var(--green)",fail:"var(--red)",run:"var(--orange)"}[r[1]];return `<div class="it"><i class="dot" style="background:${c};margin-top:6px"></i><span style="min-width:0"><span class="mono fog">#${n}</span> ${esc(r[0])}<div class="fog" style="font-size:12px">${esc(r[2])}</div></span></div>`}).join(""):`<p class="fog" style="font-size:13px;margin:0">None.</p>`}</div>
    <div class="box side-list"><h2>Next</h2>${p.next.map(t=>`<div class="it">${esc(t)}</div>`).join("")}</div>
    <div class="box side-list"><h2>Activity</h2>${logRows(DATA.log.filter(r=>r.project===id))}</div>
   </aside></div><p class="dw-hint">← → or swipe to move between projects · Esc to close</p>`;
}
const logRows=rows=>rows.length?rows.sort((a,b)=>b.at.localeCompare(a.at)).map(r=>`<div class="it"><span class="mono ash" style="white-space:nowrap;font-size:12px;padding-top:1px">${r.at.slice(5,10)} ${hm(r.at)}</span><span style="min-width:0">${esc(r.text)}<div class="fog" style="font-size:12px">${esc(r.choice)} · ${r.by==="you"?"you":r.by==="default"?`<span style="color:var(--orange)">agent default</span>`:"loop rule"}</div></span></div>`).join(""):`<p class="fog" style="font-size:13px;margin:0">Nothing yet.</p>`;
function viewAgents(prod){
  const list=DATA.agents.filter(a=>prod==="all"||proj(a.project).product===prod),byP={};list.forEach(a=>byP[a.provider]=(byP[a.provider]||0)+a.tokens);const tot=Object.values(byP).reduce((s,n)=>s+n,0)||1;
  return `<div style="margin-top:16px" class="box"><h2>Tokens today <span class="ct">${fmtTok(tot)}</span></h2><div class="tok-bar">${Object.entries(byP).map(([p,n])=>`<span style="width:${100*n/tot}%;background:${DATA.provColors[p]}"></span>`).join("")}</div><div class="legend">${Object.entries(byP).map(([p,n])=>`<span><i style="background:${DATA.provColors[p]}"></i>${p} ${fmtTok(n)}</span>`).join("")}</div></div>
   <div class="box" style="padding:6px 6px"><table class="tbl stack"><thead><tr><th>Agent</th><th>Who</th><th>Project</th><th>Task</th><th>State</th><th class="num">Since</th><th class="num">Tokens</th></tr></thead><tbody>${
   list.map(a=>`<tr><td>${agentChip(a)}</td><td class="full">${esc(a.who)}<div class="sm">${esc(a.provider)} · ${esc(a.model)} · ${esc(a.via)}</div></td><td><a href="#/p/${a.project}" style="text-decoration:underline;text-underline-offset:3px">${esc(proj(a.project).name)}</a></td><td class="full">${esc(a.task)}</td><td><span class="health"><i class="dot d-${a.state}"></i>${ST[a.state]}</span></td><td class="num mono fog">${ago(a.since)}</td><td class="num mono">${fmtTok(a.tokens)}</td></tr>`).join("")}</tbody></table></div>`;
}
function viewLog(prod){
  const saved=Object.entries(answers).map(([id,a])=>{const l=DATA.levers.find(x=>x.id===id);return l&&{at:a.at,project:l.project,text:l.title,choice:(l.options.find(o=>o[0]===a.choice)||[,a.choice])[1],by:"you"}}).filter(Boolean);
  return `<div class="box side-list" style="margin-top:16px"><h2>Decision log <span class="ct">your answers, agent defaults, loop keep/discard</span></h2>${logRows([...saved,...DATA.log].filter(r=>prod==="all"||proj(r.project).product===prod))}</div>`;
}

/* ---------- shell ---------- */
const ICON={home:'<path d="M2.5 7L8 2.5 13.5 7v6.5h-11z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>',agents:'<circle cx="8" cy="5.5" r="2.5" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M3 13.5c.8-2.6 2.7-3.8 5-3.8s4.2 1.2 5 3.8" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>',log:'<path d="M3 4h10M3 8h10M3 12h6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>',box:'<rect x="2.5" y="2.5" width="11" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="1.3"/>'};
const ic=k=>`<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">${ICON[k]}</svg>`;
function parse(){const h=location.hash.replace(/^#\/?/,"").split("/");
  if(h[0]==="p"&&proj(h[1]))return {product:proj(h[1]).product,view:"project",id:h[1]};
  const prod=DATA.products[h[0]]||h[0]==="all"?h[0]:"acme";return {product:prod,view:["agents","log"].includes(h[1])?h[1]:"home",id:null}}
function render(){
  route=parse();
  const keys=[...Object.keys(DATA.products),"all"],sv=route.view==="agents"||route.view==="log"?"/"+route.view:"";
  const cur=k=>route.product===k?'aria-current="page"':"",n=k=>proto.empty?0:openLevers(k).length;
  $("#side").innerHTML=`<div class="brand"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><rect x=".75" y=".75" width="16.5" height="16.5" rx="4" fill="none" stroke="#fff" stroke-width="1.5"/><path d="M4.5 11.5h9M9 11.5V5" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/></svg>Factory</div>
   ${[["home","Home"],["agents","Agents"],["log","Decision log"]].map(([k,t])=>`<button class="nav" data-sec="${k}" ${(route.view===k||(k==="home"&&route.view==="project"))?'aria-current="page"':""}>${ic(k)}${t}${k==="home"?`<span class="cnt ${n(route.product)?"":"z"}">${n(route.product)}</span>`:""}</button>`).join("")}
   <div class="grp">Products</div>${keys.map(k=>`<a class="nav" href="#/${k}${sv}" ${cur(k)}>${ic("box")}${k==="all"?"All products":esc(DATA.products[k].name)}${k==="all"?"":`<span class="cnt ${n(k)?"":"z"}">${n(k)}</span>`}</a>`).join("")}
   <div class="foot">Synthetic data · built ${hm(DATA.builtAt)} UTC</div>`;
  $("#ptabs").innerHTML=keys.map(k=>`<a class="ptab" href="#/${k}${sv}" ${cur(k)}>${k==="all"?"All":esc(DATA.products[k].name)}${k==="all"?"":`<span class="cnt ${n(k)?"":"z"}">${n(k)}</span>`}</a>`).join("");
  $("#bottombar").innerHTML=[["home","Home"],["agents","Agents"],["log","Log"]].map(([k,t])=>`<button data-sec="${k}" ${(route.view===k||(k==="home"&&route.view==="project"))?'aria-current="page"':""}>${ic(k)}${t}</button>`).join("");
  $("#title").textContent=route.product==="all"?"All products":DATA.products[route.product].name;
  $("#subtitle").textContent=route.view==="agents"?"Agents":route.view==="log"?"Decision log":"Projects";
  const v=route.view==="agents"?viewAgents(route.product):route.view==="log"?viewLog(route.product):route.product==="all"?viewAll():viewHome(route.product);
  $("#main").innerHTML=v+`<details class="proto"><summary>Prototype states (not in the real page)</summary><div class="proto-grid">${[["empty","Nothing waiting"],["saveFails","Save fails"],["noKey","Missing ?k= key"],["stale","Stale data"]].map(([k,l])=>`<label><input type="checkbox" data-proto="${k}" ${proto[k]?"checked":""}>${l}</label>`).join("")}<button class="btn" type="button" id="reset">Clear saved answers</button></div></details>`;
  tick();syncDrawer();
}
function tick(){const el=document.getElementById("refresh");if(!el)return;el.className="meta-line"+(dirty?" paused":"");el.textContent=dirty?"Auto-refresh paused: unsaved answer":`${NOW.toISOString().slice(0,10)} ${hm(NOW.toISOString())} UTC · data built ${hm(DATA.builtAt)} · refresh in ${Math.floor(refreshIn/60)}:${String(refreshIn%60).padStart(2,"0")}`}

let lastProj=null;
function syncDrawer(){
  const dw=$("#drawer");
  if(route.view!=="project"){if(dw.open)dw.close();lastProj=null;return}
  const order=projOrder(route.product),i=order.findIndex(p=>p.id===route.id),p=proj(route.id);
  $("#dwTitle").innerHTML=`${esc(DATA.products[p.product].name)} › <b>${esc(p.name)}</b>`;
  $("#dwPos").textContent=(i+1)+" / "+order.length;
  $("#dwPrev").disabled=i<=0;$("#dwNext").disabled=i>=order.length-1;
  $("#dwStrip").innerHTML=order.map(q=>`<a href="#/p/${q.id}" aria-current="${q.id===route.id}">${healthIcon(stats(q).health,12)}${esc(q.name)}${leverCount(q)}</a>`).join("");
  const body=$("#dwBody"),slide=$("#dwSlide"),keep=lastProj===route.id?body.scrollTop:0;
  const dir=lastProj&&lastProj!==route.id?(order.findIndex(q=>q.id===lastProj)<i?"from-r":"from-l"):null;
  slide.innerHTML=viewProject(route.id);body.scrollTop=keep;
  if(dir){slide.classList.add(dir);requestAnimationFrame(()=>requestAnimationFrame(()=>slide.classList.remove(dir)))}
  if(!dw.open)dw.showModal();
  $("#dwStrip [aria-current=true]")?.scrollIntoView({inline:"nearest",block:"nearest"});
  lastProj=route.id;
}
function step(d){const o=projOrder(route.product),i=o.findIndex(p=>p.id===route.id),n=o[i+d];if(n)location.replace("#/p/"+n.id)}
function closeDrawer(){if(route.view==="project")location.hash="#/"+route.product}
$("#drawer").addEventListener("cancel",e=>{e.preventDefault();if(dirty&&!confirm("Discard your unsaved answer?"))return;closeDrawer()});
$("#drawer").addEventListener("click",e=>{if(e.target.id==="drawer")closeDrawer()});
$("#dwClose").onclick=closeDrawer;$("#dwPrev").onclick=()=>step(-1);$("#dwNext").onclick=()=>step(1);
document.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&e.target.matches?.(".card[data-open]")){location.hash="#/p/"+e.target.dataset.open;return}
  if(route.view!=="project"||/TEXTAREA|INPUT/.test(document.activeElement.tagName))return;if(e.key==="ArrowRight")step(1);if(e.key==="ArrowLeft")step(-1)});
// inbox keyboard: j/k move, Enter open, 1-4 pick an option, Cmd/Ctrl+Enter save
let kIdx=-1;
document.addEventListener("keydown",e=>{
  const typing=/TEXTAREA|INPUT/.test(document.activeElement.tagName);
  if((e.metaKey||e.ctrlKey)&&e.key==="Enter"){const f=document.querySelector("[data-form]");if(f){e.preventDefault();f.requestSubmit()}return}
  if(typing||route.view==="project"||e.metaKey||e.ctrlKey||e.altKey)return;
  const rows=[...document.querySelectorAll("#main .ib")];if(!rows.length)return;
  if(e.key==="j"||e.key==="k"){kIdx=Math.max(0,Math.min(rows.length-1,kIdx+(e.key==="j"?1:-1)));rows.forEach((r,i)=>r.classList.toggle("kfocus",i===kIdx));rows[kIdx].scrollIntoView({block:"nearest"});return}
  if(e.key==="Enter"&&kIdx>=0&&document.activeElement===document.body){rows[kIdx]?.querySelector("[data-lever]")?.click();return}
  if(/^[1-4]$/.test(e.key)){const f=document.querySelector("#main [data-form]");const o=f?.querySelectorAll("input[name=c]")[+e.key-1];if(o&&!o.disabled){o.checked=true;dirty=true;tick()}}
});
let t0=null;
$("#dwBar").addEventListener("pointerdown",e=>{if(e.target.closest("button"))return;t0={y:e.clientY};$("#dwBar").setPointerCapture(e.pointerId)});
$("#dwBar").addEventListener("pointermove",e=>{if(!t0||!matchMedia("(max-width:720px)").matches)return;$("#drawer").style.transition="none";$("#drawer").style.transform=`translateY(${Math.max(0,e.clientY-t0.y)}px)`});
$("#dwBar").addEventListener("pointerup",e=>{if(!t0)return;const dy=e.clientY-t0.y,dw=$("#drawer");dw.style.transition="";dw.style.transform="";t0=null;if(dy>110&&matchMedia("(max-width:720px)").matches)closeDrawer()});
let sx=null;
$("#dwBody").addEventListener("touchstart",e=>{sx=[e.touches[0].clientX,e.touches[0].clientY]},{passive:true});
$("#dwBody").addEventListener("touchend",e=>{if(!sx)return;const dx=e.changedTouches[0].clientX-sx[0],dy=e.changedTouches[0].clientY-sx[1];sx=null;if(Math.abs(dx)>70&&Math.abs(dx)>2*Math.abs(dy)&&!e.target.closest("svg,table"))step(dx<0?1:-1)});
addEventListener("hashchange",()=>{const was=route.view==="project";openLever=null;dirty=false;render();if(route.view!=="project"&&!was)scrollTo(0,0)});
document.addEventListener("click",e=>{
  const s=e.target.closest("[data-sec]");if(s){const k=s.dataset.sec;location.hash="#/"+route.product+(k==="home"?"":"/"+k);return}
  const lv=e.target.closest("[data-lever]");if(lv){if(dirty&&openLever!==lv.dataset.lever&&!confirm("Discard your unsaved answer?"))return;openLever=openLever===lv.dataset.lever?null:lv.dataset.lever;dirty=false;render();return}
  const lp=e.target.closest("[data-loop]");if(lp){e.stopPropagation();const id=lp.dataset.loop;expandedLoops.has(id)?expandedLoops.delete(id):expandedLoops.add(id);render();return}
  const c=e.target.closest(".card[data-open]");if(c&&!e.target.closest("a,button")){location.hash="#/p/"+c.dataset.open;return}
  if(e.target.id==="reset"){for(const k in answers)delete answers[k];localStorage.removeItem("factory-l-answers");render()}
});
document.addEventListener("change",e=>{const k=e.target.dataset?.proto;if(k){proto[k]=e.target.checked;render()}});
document.addEventListener("input",e=>{if(e.target.closest("[data-form]")){dirty=true;tick()}});
document.addEventListener("submit",e=>{
  const f=e.target.closest("[data-form]");if(!f)return;e.preventDefault();
  const choice=[...f.querySelectorAll("input[name=c]")].find(i=>i.checked)?.value,msg=f.querySelector(".msg"),btn=f.querySelector("button[type=submit]");
  if(!choice){msg.innerHTML=`<span class="err">Pick an option first.</span>`;return}
  btn.disabled=true;btn.textContent="Saving…";
  setTimeout(()=>{btn.disabled=false;btn.textContent="Save answer";
    if(proto.saveFails){msg.innerHTML=`<span class="err">Not saved: the server did not answer (503). Your answer is still here; try again.</span>`;return}
    answers[f.dataset.form]={choice,note:f.note.value,at:new Date().toISOString()};localStorage.setItem("factory-l-answers",JSON.stringify(answers));
    openLever=null;dirty=false;render()},500);
});
setInterval(()=>{if(!dirty)refreshIn=refreshIn>0?refreshIn-1:300;tick()},1000);
render();
</script>
</body>
</html>
