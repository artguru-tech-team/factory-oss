const BOARD_COLS=[["intake","Intake"],["triage","Triage"],["building","Building"],["review","Review"],["waiting","Waiting on you"],["merged","Merged"]];
const BOARD_SOURCE={sentry:"Sentry",signoz:"SigNoz",bug:"Bug report",support:"Support",manual:"Manual"};
let autoTab="board";
let boardFilters={product:"all",source:"all",stuck:false,pill:"all"};
let openBoardCard=null;
let boardLoaded=false;

function loadBoardFromServer(){
  fetch("api/board"+Q)
    .then(r=>r.json().catch(()=>({})).then(b=>({ok:r.ok,b})))
    .then(({ok,b})=>{
      if(!ok||!b||!Array.isArray(b.cards))return;  // fall back to DATA.board
      DATA.board={...(DATA.board||{}),cards:b.cards,fetchedAt:b.fetchedAt,error:b.error,repoErrors:b.repoErrors,auto_promote:b.auto_promote};
      if(route.view==="automation"&&autoTab==="board")render();
    })
    .catch(()=>{});
}

function viewBoard(prod){
  const b=DATA.board||{cards:[],fetchedAt:null,error:null,auto_promote:true};
  // the top product pill sets the default once; the board's own filter then wins until the pill changes
  const pill=prod||"all";
  if(boardFilters.pill!==pill){boardFilters.pill=pill;boardFilters.product=pill;}
  const f=boardFilters;
  const filtered=b.cards.filter(c=>{
    if(f.product!=="all"&&c.product!==f.product)return false;
    if(f.source!=="all"&&c.source!==f.source)return false;
    if(f.stuck&&!c.stuck)return false;
    return true;
  });
  const filterRow=`<div class="filter-row">
    <select class="select" aria-label="Product" data-bfilter="product">
      <option value="all" ${f.product==="all"?"selected":""}>All products</option>
      ${Object.keys(DATA.products||{}).map(k=>`<option value="${esc(k)}" ${f.product===k?"selected":""}>${esc(DATA.products[k].name)}</option>`).join("")}
    </select>
    <select class="select" aria-label="Source" data-bfilter="source">
      <option value="all" ${f.source==="all"?"selected":""}>All sources</option>
      ${Object.entries(BOARD_SOURCE).map(([k,t])=>`<option value="${k}" ${f.source===k?"selected":""}>${t}</option>`).join("")}
    </select>
    <button class="btn" type="button" aria-pressed="${f.stuck}" data-bstuck ${f.stuck?'style="background:var(--paper);color:var(--void);font-weight:510"':''}>Only stuck</button>
  </div>`;
  const strip=`<div class="box" style="margin:10px 0 14px;padding:10px 12px">
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <input type="checkbox" class="toggle" ${b.auto_promote?"checked":""} aria-label="Auto-promote" data-bautopromote>
      <span style="font-size:13px;color:var(--paper);font-weight:510">Auto-promote</span>
      <span class="fog" style="font-size:12px">${b.auto_promote?"On: money, auth, infra and support wait for you. Read by the triage agent.":"Off: every intake issue waits for you."}</span>
      <button class="linkbtn" type="button" style="margin-left:auto" aria-expanded="false" data-brules>Rules</button>
    </div>
    <ul id="boardRules" hidden class="fog" style="font-size:12px;line-height:1.6;margin:8px 0 0 18px;padding:0">
      <li>Source is Sentry sweep or bug report. Support tickets always wait for you.</li>
      <li>Triage found the cause: a stack trace or repro steps pointing at repo code.</li>
      <li>Fix touches 3 files or fewer, none in payments, payouts, wallet, billing, auth, Prisma schema, infra, CI or secrets.</li>
      <li>At most 5 per day across all repos. You still merge every PR.</li>
    </ul>
  </div>`;
  const colsHTML=b.cards.length?`<div class="board-wrap"><div class="board-grid">${BOARD_COLS.map(([id,name])=>{
    const cards=filtered.filter(c=>c.col===id);
    return `<div class="panel">
      <div class="panel-h"><h2>${name} <span class="ct">${cards.length}</span></h2></div>
      <div class="board-cards">${cards.map(viewBoardCard).join("")||'<div class="empty fog">No issues</div>'}</div>
    </div>`;
  }).join("")}</div></div>`:"";
  const errorBanner=`<div class="banner stop" style="padding:24px 20px;text-align:center;margin-top:12px">
    <div style="font-size:14px;font-weight:510;color:var(--red);margin-bottom:6px">GitHub unreachable</div>
    <div class="fog" style="font-size:13px">${b.fetchedAt?`Last good data ${hm(b.fetchedAt)}. `:""}Check your connection or GitHub status.</div>
    <button class="btn" type="button" style="margin-top:14px" data-board-retry>Retry</button>
  </div>`;
  const emptyBox=`<div class="box empty" style="text-align:center;padding:48px 16px;margin-top:12px">
    <h2 style="justify-content:center;margin-bottom:8px">No factory issues</h2>
    <p class="fog" style="font-size:13px">Automations file new issues as intake.</p>
  </div>`;
  const re=Object.entries(b.repoErrors||{});
  const repoWarn=!b.error&&re.length?`<div class="banner warn" style="margin:0 0 12px;font-size:12px">Showing last good cards for ${re.map(([r,e])=>`<span class="mono">${esc(r)}</span> (${esc(e)})`).join(", ")}: GitHub could not read ${re.length>1?"them":"it"}.</div>`:"";
  let body;
  if(b.error){body=errorBanner+(colsHTML?colsHTML:"");}
  else if(!b.cards.length){body=emptyBox;}
  else{body=colsHTML;}
  return filterRow+strip+repoWarn+body;
}

function viewBoardCard(c){
  const src=BOARD_SOURCE[c.source]||"Manual";
  const stuck=c.stuck?'<span class="badge" style="color:var(--orange)">Stuck</span>':'';
  const auto=c.auto?'<span class="badge" title="Promoted by auto-promote rules">Auto</span>':'';
  const pr=c.pr?`<a class="badge mono" href="${esc(c.pr.url||"")}" target="_blank" rel="noopener" style="font-size:11px" onclick="event.stopPropagation()">PR #${c.pr.number}</a>`:"";
  const acts=c.col==="intake"?`<div class="card-acts">
      <button class="btn" type="button" data-bpromote="${esc(c.id)}">Promote to factory</button>
      <button class="btn" type="button" data-bclose="${esc(c.id)}">Dismiss</button>
    </div>`:"";
  return `<article class="card bcard" role="button" tabindex="0" data-bcard="${esc(c.id)}">
    <div class="card-h"><span class="nm">${esc(c.repoShort)} #${c.num}</span><span class="right">${stuck}</span></div>
    <div class="t">${esc(c.title)}</div>
    <div class="card-meta"><span class="badge">${src}</span>${auto}${pr}</div>
    ${acts}
  </article>`;
}

function closeBoardDrawer(){openBoardCard=null;const t=$("#boardSbReason");if(t)t.value="";const dw=$("#boardDrawer");if(dw&&dw.open)dw.close();}
function syncBoardDrawer(){

function renderBoardDrawer(card){
  const colName=(BOARD_COLS.find(x=>x[0]===card.col)||[card.col,card.col])[1];

  if((card.col==="review"||card.col==="building")&&card.pr)actions.push(`<button class="btn" type="button" data-bsbtoggle>Send back to agent</button>`);
  if(card.col!=="merged")actions.push(`<button class="btn danger" type="button" data-bclose="${esc(card.id)}">Close issue</button>`);
  return `<h3 class="pp-title">${esc(card.title)}</h3>
    <div class="props">
      <span class="prop"><span class="k">Repo</span>${esc(card.repo)} #${card.num}</span>

      <h2>Timeline</h2>

      <textarea id="boardSbReason" class="input" style="height:72px;padding:8px 12px;resize:vertical" placeholder="What the agent should change (required)"></textarea>
      <div id="boardSbErr" class="err" style="display:none">Describe what to change before sending back.</div>

function loadBoardTimeline(card){
  const el=$("#boardTimeline");if(!el)return;

    .then(r=>r.json().catch(()=>({})).then(b=>({ok:r.ok,status:r.status,b})))
    .then(({ok,status,b})=>{

    })
    .catch(()=>{el.innerHTML='<div class="fog">Could not load timeline.</div>';});
}

    return;
  }
  const f=e.target.closest("[data-form]");if(!f)return;e.preventDefault();
  const choice=[...f.querySelectorAll("input[name=c]")].find(i=>i.checked)?.value,msg=f.querySelector(".msg"),btn=f.querySelector("button[type=submit]");
  if(!choice){msg.innerHTML=`<span class="err">Pick an option first.</span>`;return}
  btn.disabled=true;btn.textContent="Saving…";
  const id=f.dataset.form,fail=t=>{btn.disabled=false;btn.textContent="Save answer";msg.innerHTML=`<span class="err">Not saved: ${esc(t)}. Your answer is still here; try again.</span>`};
  fetch("api/answers"+Q,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({[id]:{choice,note:f.note.value}})})
   .then(r=>r.json().catch(()=>({})).then(b=>{
     if(r.status===403&&!b.error?.includes("key")){btn.disabled=false;btn.textContent="Save answer";signedOut=true;renderPreservingDraft();return}
     if(r.status===409){
       btn.disabled=false;btn.textContent="Save answer";
       closedInfo[id]={resolvedAt:b.resolvedAt,answeredAt:b.answeredAt};
       msg.innerHTML=`<span class="ok">${esc(closedMsg(b))}</span>`;
       dirty=false;
       pending409.add(id);
       setTimeout(()=>{
         pending409.delete(id);
         DATA.levers=DATA.levers.filter(l=>l.id!==id);
         // the item is handled: its draft is moot, so it goes even mid-typing; other drafts survive
         if(openLever===id){openLever=null;dirty=false}
         renderPreservingDraft();
       },3000);
       return;
     }
     if(!r.ok)return fail(b.error||"the server answered "+r.status);
     for(const k in answers)delete answers[k];Object.assign(answers,b);openLever=null;dirty=false;render()
   }),()=>fail("the server did not answer"));
});
let closedInfo={};
const pending409=new Set();
function renderPreservingDraft(){
  if(quiet()){
    render();
    return;
  }
  const active=document.activeElement;
  let activeRef=null,selStart=null,selEnd=null;
  if(active&&(active.tagName==="INPUT"||active.tagName==="TEXTAREA")){
    activeRef=active;
    try{selStart=active.selectionStart;selEnd=active.selectionEnd}catch(_){}
  }
  const savedLeverForms=[];
  for(const f of document.querySelectorAll("form[data-form]")){
    savedLeverForms.push({form:f,inDrawer:Boolean(f.closest("#drawer")),id:f.dataset.form});
  }
  if(savedLeverForms.length>1){
    const activeForm=savedLeverForms.find(sf=>sf.form.contains(active))?.form||
                     savedLeverForms.find(sf=>sf.form.querySelector("textarea")?.value)?.form||
                     savedLeverForms[0].form;
    const activeText=activeForm.querySelector("textarea")?.value;
    const checkedRadio=activeForm.querySelector("input[name=c]:checked")?.value;
    for(const sf of savedLeverForms){
      if(sf.form!==activeForm){
        const ta=sf.form.querySelector("textarea");
        if(ta&&activeText!==undefined)ta.value=activeText;
        if(checkedRadio!==undefined){
          for(const r of sf.form.querySelectorAll("input[name=c]"))r.checked=(r.value===checkedRadio);
        }
      }
    }
  }
  for(const sf of savedLeverForms)sf.form.remove();

  let savedAgentForm=null,savedAgentHc=null;
  const mf=document.querySelector("form[data-agent-form]");
  if(mf){
    savedAgentForm=mf;
    savedAgentHc=mf.dataset.agentForm;
    mf.remove();
  }

  render();

  for(const sf of savedLeverForms){
    const fresh=document.querySelector((sf.inDrawer?"#drawer ":"#main ")+`form[data-form="${sf.id}"]`)||
                document.querySelector(`form[data-form="${sf.id}"]`);
    if(fresh)fresh.replaceWith(sf.form);
    // a restored form keeps its old message; signed out must still show in it (the banner can be hidden behind the drawer)
    const msg=sf.form.querySelector(".msg");
    if(signedOut&&msg&&!msg.querySelector(".ok"))msg.innerHTML=`<span class="err">Signed out: reload to sign in again.</span>`;
  }
  if(savedAgentForm&&savedAgentHc){
    const fresh=document.querySelector(`form[data-agent-form="${savedAgentHc}"]`);
    if(fresh)fresh.replaceWith(savedAgentForm);
  }

  if(activeRef&&document.contains(activeRef)){
    activeRef.focus();
    if(selStart!==null&&selEnd!==null&&typeof activeRef.setSelectionRange==="function"){
      try{activeRef.setSelectionRange(selStart,selEnd)}catch(_){}
    }
  }
}
function pollInbox(){
  fetch("api/inbox/open"+Q)
    .then(r=>r.json().catch(()=>({})).then(b=>{
      if(r.status===403&&!b.error?.includes("key")){if(!signedOut){signedOut=true;renderPreservingDraft()}return}
      if(!r.ok||!Array.isArray(b.open))return;
      if(b.closed)Object.assign(closedInfo,b.closed);
      const openSet=new Set(b.open);
      const prev=DATA.levers.length;
      DATA.levers=DATA.levers.filter(l=>openSet.has(l.id)||pending409.has(l.id)||(dirty&&l.id===openLever));
      if(dirty&&openLever&&!openSet.has(openLever)&&!pending409.has(openLever)){
        const info=closedInfo[openLever]||b.closed?.[openLever];
        for(const f of document.querySelectorAll(`form[data-form="${openLever}"]`)){
          const msg=f.querySelector(".msg");
          if(msg)msg.innerHTML=`<span class="ok">${esc(closedMsg(info||{},true))}</span>`;
        }
      }
      if(DATA.levers.length!==prev){
        if(quiet())render();
        else renderPreservingDraft();
      }
    }))
    .catch(()=>{});
}
// one quiet test for redraws and the auto-reload: no unsaved answer, no message draft, no 409 notice on screen
const quiet=()=>!dirty&&!hasMsgDraft()&&pending409.size===0;
setInterval(()=>{if(quiet()){if(refreshIn<=0)return location.reload();refreshIn--}tick()},1000);
setInterval(pollInbox,30000);
window.addEventListener("focus",pollInbox);
render();
pollInbox();
fetch("api/answers"+Q).then(r=>r.ok?r.json():Promise.reject(r)).then(b=>{for(const k in answers)delete answers[k];Object.assign(answers,b);renderPreservingDraft()},r=>{if(r?.status===403){signedOut=true;renderPreservingDraft()}});
</script>
