html{background:var(--void);color:var(--mist);font:400 14px/1.5 var(--sans);font-feature-settings:"cv01","ss03","zero";-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;scrollbar-color:var(--graphite) var(--void)}
body{margin:0;font-variant-numeric:tabular-nums}
::selection{background:rgba(99,102,241,.4);color:var(--paper)}
a{color:var(--mist);text-decoration:none} a:hover{color:var(--paper)}
:focus-visible{outline:1.5px solid var(--mist);outline-offset:2px;border-radius:4px}
button{font:inherit;color:inherit}
.mono{font-family:var(--mono);letter-spacing:-.013em}
.fog{color:var(--fog)} .ash{color:var(--ash)}
h1,h2,h3{font-weight:510;color:var(--paper);margin:0;letter-spacing:-.011em}
h2{font-size:13px;color:var(--mist);display:flex;gap:8px;align-items:center;margin:0 0 8px}
h2 .ct{font:400 12px var(--mono);color:var(--fog)}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:6px;border:1px solid var(--graphite);background:transparent;color:var(--mist);font-size:13px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--wash);color:var(--paper)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--lime);color:var(--void);border-color:var(--lime);font-weight:510;height:34px;padding:0 16px;box-shadow:rgba(0,0,0,.07) 0 1px 1px,rgba(0,0,0,.08) 0 0 1px}
.btn.primary:hover{background:#eef75a}
.icon-btn{width:30px;height:30px;display:grid;place-items:center;border-radius:6px;border:1px solid var(--graphite);background:transparent;color:var(--mist);cursor:pointer;flex:none}
.icon-btn:hover{background:var(--wash);color:var(--paper)} .icon-btn:disabled{opacity:.35;cursor:default;background:none}
.linkbtn{background:none;border:0;padding:0;color:var(--fog);cursor:pointer;font-size:12px}
.linkbtn:hover{color:var(--paper)}

/* shell */
.app{display:grid;grid-template-columns:1fr;min-height:100dvh}
.side{display:none}
.topbar{position:sticky;top:0;z-index:6;background:rgba(8,9,10,.92);backdrop-filter:blur(8px);border-bottom:.5px solid var(--graphite)}
.topbar-in{display:flex;align-items:center;gap:10px;height:48px;padding:0 16px}
.topbar h1{font-size:14px}
.topbar .sub{font-size:12px;color:var(--fog)}
.topbar .right{margin-left:auto;display:flex;gap:6px}
.ptabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:0 16px 10px}
.ptab{height:28px;padding:0 10px;border-radius:9999px;background:var(--wash);color:var(--mist);font-size:12px;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.ptab[aria-current=page]{background:var(--paper);color:var(--void);font-weight:510}
.cnt{font:400 11px var(--mono);min-width:16px;height:16px;padding:0 4px;border-radius:4px;display:inline-grid;place-items:center;background:var(--red);color:#fff}
.cnt.z{background:var(--graphite);color:var(--fog)}
.ptab[aria-current=page] .cnt.z{background:#d5d7db;color:var(--void)}
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:var(--carbon);border-top:.5px solid var(--graphite);padding-bottom:env(safe-area-inset-bottom)}
.bottombar button{flex:1;background:none;border:0;padding:8px 0 10px;font-size:11px;color:var(--fog);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.bottombar button[aria-current=page]{color:var(--paper)}
main{padding:0 16px 96px;min-width:0}
@media (min-width:900px){
  .app{grid-template-columns:232px 1fr}
  .side{display:flex;flex-direction:column;gap:2px;padding:12px 10px;background:var(--carbon);border-right:.5px solid var(--graphite);position:sticky;top:0;height:100dvh}
  .side .brand{display:flex;gap:8px;align-items:center;color:var(--paper);font-weight:510;font-size:14px;padding:6px 8px 14px}
  .side .grp{font-size:11px;color:var(--ash);padding:14px 8px 4px;font-weight:510}
  .nav{display:flex;align-items:center;gap:9px;height:30px;padding:0 8px;border-radius:6px;color:var(--mist);font-size:13px;background:none;border:0;cursor:pointer;width:100%;text-align:left}
  .nav:hover{background:var(--wash)}
  .nav[aria-current=page]{background:var(--obsidian);color:var(--paper)}
  .nav .cnt{margin-left:auto}
  .nav svg{color:var(--fog);flex:none}
  .side .foot{margin-top:auto;font-size:11px;color:var(--ash);padding:8px}
  .ptabs,.bottombar,.topbar .brand-m{display:none}
  main{padding:0 32px 48px}
  .topbar-in{padding:0 32px}
}

/* status */
.status{margin:16px 0 4px;max-width:78ch;color:var(--mist);font-size:14px}
.status b{color:var(--paper);font-weight:510}
.meta-line{font:12px var(--mono);color:var(--ash);margin:0 0 4px}
.meta-line.paused{color:var(--orange)}
.banner{margin:12px 0 0;padding:8px 12px;border-radius:6px;background:var(--wash2);box-shadow:inset 0 0 0 1px var(--graphite);font-size:13px}
.banner.warn{box-shadow:inset 0 0 0 1px rgba(242,153,74,.5)} .banner.stop{box-shadow:inset 0 0 0 1px rgba(235,87,87,.55)}

/* home grid */
.home{display:grid;gap:24px;grid-template-columns:1fr;margin-top:16px}
.home>*{min-width:0}
@media (min-width:1100px){.home{grid-template-columns:minmax(320px,380px) 1fr}.inbox{position:sticky;top:64px;align-self:start}}
.panel{background:var(--carbon);border-radius:12px;box-shadow:var(--shadow,inset 0 0 0 1px var(--graphite));padding:6px 0}
.panel-h{display:flex;align-items:center;gap:8px;padding:10px 14px 6px}
.panel-h h2{margin:0}
.cards{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:1400px){.cards{grid-template-columns:1fr 1fr}}
.section-h{display:flex;align-items:center;gap:8px;margin:0 0 10px}
.section-h .fog{font-size:12px}

/* inbox rows */
.ib{border-top:.5px solid var(--graphite)}
.ib:first-of-type{border-top:0}
.ib-row{display:flex;gap:10px;align-items:flex-start;width:100%;padding:10px 14px;background:none;border:0;text-align:left;cursor:pointer}
.ib-row:hover{background:var(--wash2)}
.ib.open .ib-row{background:var(--wash2)}
.ib-row .t{color:var(--paper);font-weight:510;font-size:13px;line-height:1.35}
.ib-row .s{font-size:12px;color:var(--fog);line-height:1.4}
.ib-row .when{margin-left:auto;font:11px var(--mono);color:var(--ash);white-space:nowrap;padding-top:2px}
.ib.done .t{color:var(--fog);font-weight:400}
.ib-body{padding:2px 14px 14px 40px}
.ctx{margin:0 0 10px;font-size:13px;color:var(--mist)}
.ctx a{color:var(--fog);text-decoration:underline;text-underline-offset:3px}
.opts{display:grid;gap:4px;margin:0 0 10px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:6px;background:var(--wash2);box-shadow:inset 0 0 0 1px var(--line);cursor:pointer;font-size:13px;color:var(--mist)}
.opt:hover{background:var(--wash)}
.opt input{appearance:none;width:14px;height:14px;margin:2px 0 0;border-radius:50%;border:1.5px solid var(--fog);display:grid;place-items:center;flex:none}
.opt input:checked{border-color:var(--paper)} .opt input:checked::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--paper)}
.opt:has(input:checked){box-shadow:inset 0 0 0 1px var(--mist);color:var(--paper)}
.why{font-size:12px;color:var(--fog);margin:0 0 10px}
textarea{font:inherit;font-size:13px;width:100%;min-height:56px;padding:9px 12px;border-radius:6px;border:1px solid var(--line);background:var(--wash2);color:var(--mist);resize:vertical}
textarea:focus{outline:none;border-color:var(--mist)}
textarea::placeholder{color:var(--ash)}
.form-foot{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap}
.ok{font-size:12px;color:var(--green)} .err{font-size:12px;color:var(--red)}
.applied{font-size:12px;color:var(--fog);background:var(--wash2);border-radius:6px;padding:7px 10px;margin:0 0 10px;box-shadow:inset 0 0 0 1px var(--line)}
.empty{padding:18px 14px;font-size:13px;color:var(--fog)}
.sum{padding:10px 14px 4px;font-size:12px;color:var(--fog);display:grid;gap:3px;border-top:.5px solid var(--graphite)}
ol.next{margin:0;padding:4px 14px 10px 32px;font-size:13px;color:var(--mist)} ol.next li{padding:3px 0}

/* badges, icons */
.badge{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 6px;border-radius:4px;background:var(--wash);color:var(--fog);font-size:12px;white-space:nowrap}
.badge.rec{color:var(--green);background:rgba(39,166,68,.12)}
.health{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--mist);white-space:nowrap}
.health svg{flex:none}
.agent{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 6px 0 4px;border-radius:9999px;background:var(--wash);font:11px var(--mono);color:var(--mist);white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--fog)}
.d-running{background:var(--green)} .d-waiting{background:var(--iris)} .d-failed{background:var(--red)} .d-quota{background:var(--orange)} .d-done{background:var(--ash)} .d-stalled{background:transparent;box-shadow:inset 0 0 0 1.5px var(--orange)} .d-unknown{background:transparent;box-shadow:inset 0 0 0 1.5px var(--red)}
.prio{width:16px;height:16px;flex:none;margin-top:1px}

/* project card */
.card{background:var(--carbon);border-radius:12px;box-shadow:inset 0 0 0 1px var(--graphite);padding:14px 16px 12px;min-width:0;cursor:pointer;transition:box-shadow .15s}
.card:hover{box-shadow:inset 0 0 0 1px var(--smoke)}
.card-h{display:flex;align-items:center;gap:10px}
.card-h .nm{color:var(--paper);font-weight:510;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-h .right{margin-left:auto;display:flex;align-items:center;gap:8px;font:12px var(--mono);color:var(--mist)}
.card-meta{display:flex;align-items:center;gap:6px 12px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--fog)}
.card-meta .sep{width:1px;height:12px;background:var(--graphite)}
.upd{margin-top:10px;font-size:12px;color:var(--fog);display:flex;gap:6px;align-items:baseline}
.upd .txt{color:var(--mist);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
/* milestone track */
.ms{position:relative;height:34px;margin:14px 6px 0}
.ms .base{position:absolute;left:0;right:0;top:15px;height:2px;background:var(--graphite);border-radius:2px}
.ms .done{position:absolute;left:0;top:15px;height:2px;background:var(--iris);border-radius:2px}
.ms .today{position:absolute;top:6px;width:1px;height:20px;background:var(--fog)}
.ms .today::after{content:"today";position:absolute;top:-12px;left:50%;transform:translateX(-50%);font:10px var(--mono);color:var(--ash)}
.ms .dm{position:absolute;top:10px;width:12px;height:12px;transform:translateX(-50%)}
.ms .dm i{display:block;width:9px;height:9px;margin:1.5px;transform:rotate(45deg);border-radius:2px;background:var(--void);box-shadow:inset 0 0 0 1.5px var(--fog)}
.ms .dm.full i{background:var(--iris);box-shadow:none}
.ms .dm.part i{background:linear-gradient(135deg,var(--iris) 50%,var(--void) 50%);box-shadow:inset 0 0 0 1.5px var(--iris)}
.ms .dm span{position:absolute;top:18px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--fog);white-space:nowrap}
.ms .who{position:absolute;top:-2px;transform:translateX(-50%);display:flex;gap:2px}
.ms-l{height:16px}
/* loop compact */
.gauge{position:relative;height:6px;border-radius:3px;background:var(--graphite);margin:14px 0 6px;overflow:hidden}
.gauge i{position:absolute;inset:0 auto 0 0;background:var(--iris);border-radius:3px}
.gauge-l{display:flex;justify-content:space-between;font:11px var(--mono);color:var(--ash)}
.marks{display:flex;gap:3px;align-items:center;margin-top:10px;flex-wrap:wrap}
.marks i{width:9px;height:9px;border-radius:2px;background:var(--graphite)}
.marks i.k{background:var(--iris)}
.marks .now{display:inline-flex;gap:6px;align-items:center;margin-left:8px;font-size:12px;color:var(--mist)}
svg.chart{width:100%;height:auto;display:block;margin-top:10px;overflow:visible}
svg.chart text{font-family:var(--mono);font-size:10px;fill:var(--ash)}
svg.chart text.v{fill:var(--paper)}
.key{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:6px;font-size:12px;color:var(--fog)}
.key i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:0}
.key i.kept{background:var(--iris)} .key i.disc{box-shadow:inset 0 0 0 1.3px var(--fog)} .key i.run{box-shadow:inset 0 0 0 1.5px var(--green)}
.key i.sq{border-radius:2px} .key i.line{width:12px;height:2px;border-radius:1px;vertical-align:3px}
.bd-bar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--graphite);margin:8px 0 6px}
.bd-bar i{display:block;height:100%}
.bd-bar .m{background:var(--iris)} .bd-bar .r{background:var(--lav);opacity:.75} .bd-bar .x{background:var(--red)}
.bd-l{display:flex;flex-wrap:wrap;gap:3px 12px;font-size:12px;color:var(--fog)}
.bd-l b{color:var(--mist);font-weight:510}
.bd-l i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
.bd-two{display:grid;gap:18px;grid-template-columns:1fr}
@container drawer (min-width:560px){.bd-two{grid-template-columns:1fr 1fr}}
.bd-big .t{font-size:13px;color:var(--mist)}
.bd-big .pct{font:510 32px/1.1 var(--sans);letter-spacing:-.022em;color:var(--paper);margin:6px 0 2px}
.bd-big .pct small{font:400 13px var(--mono);color:var(--fog);margin-left:8px;letter-spacing:0}
.ib.kfocus .ib-row{background:var(--wash)}
.tbl td.num{white-space:nowrap}
.hint{font-size:11px;color:var(--ash);display:flex;gap:4px;align-items:center}
@media (max-width:1099px){.hint{display:none}}
@media (max-width:720px){.agent,.ib-row .when,.gauge-l,.meta-line,.kbd{font-size:12px}}

/* all view rows */
.grp-h{display:flex;align-items:center;gap:10px;margin:22px 0 6px;padding:0 4px}
.grp-h h2{margin:0;font-size:13px;color:var(--paper)}
.list{background:var(--carbon);border-radius:12px;box-shadow:inset 0 0 0 1px var(--graphite);overflow:hidden}
.lrow{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 14px;border-top:.5px solid var(--graphite);color:var(--mist)}
.lrow:first-child{border-top:0}
.lrow:hover{background:var(--wash2);color:var(--paper)}
.lrow .nm{color:var(--paper);font-weight:510;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .r{display:flex;gap:10px;align-items:center;font:12px var(--mono)}
.lrow .sub{grid-column:2/4;display:flex;gap:6px 12px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--fog)}
@media (min-width:900px){.lrow{grid-template-columns:18px minmax(0,1.3fr) 130px minmax(0,1.6fr) 170px}.lrow .sub{grid-column:auto}}
.lrow .date{font:12px var(--mono);color:var(--fog);text-align:right;white-space:nowrap}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-weight:400;font-size:12px;color:var(--fog);padding:8px 10px;border-bottom:.5px solid var(--graphite);white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:.5px solid var(--graphite);vertical-align:top;color:var(--mist)}
.tbl tr:last-child td{border-bottom:0}
.tbl .num{text-align:right}
.tbl .sm{font-size:12px;color:var(--fog)}
@media (max-width:720px){
  .tbl.stack thead{display:none}
  .tbl.stack tr{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 12px;border-bottom:.5px solid var(--graphite)}
  .tbl.stack td{border:0;padding:0}
  .tbl.stack td.full{grid-column:1/-1}
}
.tok-bar{display:flex;height:6px;border-radius:3px;overflow:hidden;margin:10px 0 8px;background:var(--graphite)} .tok-bar span{height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--fog)} .legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}

/* drawer (peek) */
dialog.drawer{position:fixed;inset:8px 8px 8px auto;margin:0;padding:0;height:calc(100dvh - 16px);max-height:none;width:min(920px,calc(100vw - 260px));max-width:calc(100vw - 16px);border:0;border-radius:12px;background:var(--obsidian);color:var(--mist);
  box-shadow:inset 0 0 0 1px var(--smoke),rgba(8,9,10,.6) 0 4px 32px;transform:translateX(calc(100% + 16px));transition:transform .24s cubic-bezier(.2,.9,.25,1),display .24s allow-discrete,overlay .24s allow-discrete;display:none;flex-direction:column;overflow:hidden}
dialog.drawer[open]{display:flex;transform:none}
@starting-style{dialog.drawer[open]{transform:translateX(calc(100% + 16px))}}
dialog.drawer::backdrop{background:rgba(8,9,10,0);transition:background .24s,display .24s allow-discrete,overlay .24s allow-discrete}
dialog.drawer[open]::backdrop{background:rgba(8,9,10,.55)}
@starting-style{dialog.drawer[open]::backdrop{background:rgba(8,9,10,0)}}
.dw-bar{display:flex;align-items:center;gap:6px;height:48px;padding:0 12px;border-bottom:.5px solid var(--graphite);flex:none;position:relative}
.dw-bar .crumb{font-size:13px;color:var(--fog);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-left:4px}
.dw-bar .crumb b{color:var(--paper);font-weight:510}
.dw-bar .pos{font:11px var(--mono);color:var(--ash);margin-left:auto;white-space:nowrap}
.kbd{font:11px var(--mono);color:var(--fog);background:var(--wash);border-radius:4px;padding:1px 5px}
.handle{display:none}
.dw-strip{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:8px 12px;border-bottom:.5px solid var(--graphite);flex:none}
.dw-strip a{height:26px;padding:0 10px;border-radius:9999px;display:inline-flex;gap:6px;align-items:center;font-size:12px;color:var(--fog);white-space:nowrap}
.dw-strip a:hover{background:var(--wash);color:var(--mist)}
.dw-strip a[aria-current=true]{background:var(--wash);color:var(--paper);box-shadow:inset 0 0 0 1px var(--smoke)}
.dw-body{flex:1;overflow:auto;overscroll-behavior:contain;outline:none;container:drawer/inline-size}
.dw-slide{padding:20px 24px 40px;transition:transform .2s cubic-bezier(.2,.9,.25,1),opacity .2s}
.dw-slide.from-r{transform:translateX(28px);opacity:0} .dw-slide.from-l{transform:translateX(-28px);opacity:0}
.pp-title{font-size:20px;font-weight:510;letter-spacing:-.012em;color:var(--paper);margin:6px 0 2px}
.props{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 4px}
.prop{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px;border-radius:6px;background:var(--wash2);box-shadow:inset 0 0 0 1px var(--line);font-size:12px;color:var(--mist);white-space:nowrap}
.prop .k{color:var(--ash)}
.pp-grid{display:grid;gap:20px;grid-template-columns:1fr;margin-top:18px}
.pp-grid>*{min-width:0}
@container drawer (min-width:800px){.pp-grid{grid-template-columns:1fr 300px}}
.box{background:var(--carbon);border-radius:12px;box-shadow:inset 0 0 0 1px var(--graphite);padding:14px 16px;margin-bottom:16px}
.box > h2{margin-bottom:10px}
.update{padding:12px 0;border-top:.5px solid var(--graphite)} .update:first-of-type{border-top:0;padding-top:2px}
.update .hd{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--fog)}
.update p{margin:6px 0 0;font-size:13px;color:var(--mist)}
.missed{font-size:12px;color:var(--orange)}
.mrow{display:grid;grid-template-columns:14px 1fr auto auto;gap:10px;align-items:center;padding:8px 0;border-top:.5px solid var(--graphite);font-size:13px}
.mrow:first-of-type{border-top:0}
.mrow .dmi{width:9px;height:9px;transform:rotate(45deg);border-radius:2px;box-shadow:inset 0 0 0 1.5px var(--fog)}
.mrow .dmi.full{background:var(--iris);box-shadow:none}
.mrow .dmi.part{background:linear-gradient(135deg,var(--iris) 50%,transparent 50%);box-shadow:inset 0 0 0 1.5px var(--iris)}
.side-list .it{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-top:.5px solid var(--graphite);font-size:13px}
.side-list .it:first-of-type{border-top:0}
.dw-hint{font-size:11px;color:var(--ash);margin:18px 0 0}
/* Expanded agent message row in table */
.agent-msg-tr{background:rgba(15,16,17,0.75)}
.agent-msg-td{padding:4px 8px 16px 8px!important;border-bottom:.5px solid var(--graphite)}

.msg-btn svg{flex:none}
.msg-btn.active{background:var(--wash);border-color:var(--mist);color:var(--paper)}

<script>
/* Built by `factory build` from the factory state, T3, the token scan and GitHub (see README.md). */
const DATA=/*DATA*/null;
const NOW=new Date(),DAY=864e5,D=s=>new Date(s+"T00:00:00Z");
// the key only matters from this machine; through the tunnel the Cloudflare Access login is the gate
const K=new URLSearchParams(location.search).get("k"),Q=K?"?k="+encodeURIComponent(K):"";

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hm=iso=>{const d=new Date(iso);return String(d.getUTCHours()).padStart(2,"0")+":"+String(d.getUTCMinutes()).padStart(2,"0")};
const noticeTime=iso=>{if(!iso)return"";try{const d=new Date(iso);if(isNaN(d.getTime()))return"";return hm(iso)+" UTC"}catch(_){return""}};
function closedMsg(info,kept=false){
  if(!info)return"";
  const answered=Boolean(info.answeredAt);
  const t=noticeTime(answered?info.answeredAt:info.resolvedAt);
  const parens=t?answered?` (your answer was applied at ${t})`:` (closed at ${t})`:"";
  return `Already handled by the agent${parens}${kept?". Your draft is kept; saving will not change anything.":"."}`;
}
const ago=iso=>{const m=Math.round((NOW-new Date(iso))/6e4);return m<60?m+"m":m<1440?Math.floor(m/60)+"h":Math.floor(m/1440)+"d"};
const md=d=>d.toLocaleDateString("en-GB",{month:"short",day:"numeric",timeZone:"UTC"});
const fmtTok=n=>{if(n==null)return "—";if(n>=1e9)return (n/1e9).toFixed(2)+"B";if(n>=1e6)return (n/1e6).toFixed(2)+"M";if(n>=1e3)return Math.round(n/1e3)+"k";return String(Math.round(n))};
const fmtCost=c=>c==null?"—":"$"+c.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtV=(v,u)=>u==="%"?v.toFixed(1)+"%":v.toFixed(2)+" "+esc(u);
const ST={running:"Running",done:"Done",failed:"Failed",quota:"Quota blocked",waiting:"Waiting on you",stalled:"Silent 2 h+",unknown:"Unknown T3 status"};
const sumTok=ag=>ag.reduce((s,a)=>s+(a.tokens||0),0);
const proj=id=>DATA.projects.find(p=>p.id===id);
const agentsOf=p=>DATA.agents.filter(a=>a.project===p.id);
const answers={...DATA.answers};
const openLevers=prod=>DATA.levers.filter(l=>!answers[l.id]&&!l.applied&&(prod==="all"||proj(l.project).product===prod));
const ageMin=Math.round((NOW-new Date(DATA.builtAt))/6e4);let signedOut=false;
let route={product:Object.keys(DATA.products)[0],view:"home",id:null},openLever=null,openAgent=null,dirty=false,refreshIn=300,expandedLoops=null;
const agentMessages={},threadStates={},isMac=/Mac|iPhone|iPad/.test(navigator.platform||navigator.userAgent);

/* ---------- computed state ---------- */
const RUN_MAX_AGE=10; // days: a run lane is at risk once its oldest open item is older than this
const narrow=()=>matchMedia("(max-width:720px)").matches;
function stats(p){
  const last=p.updates?.[0];
  if(p.kind==="build"){
    const d=p.phases.reduce((s,x)=>s+x[1],0),t=p.phases.reduce((s,x)=>s+x[2],0);
    // the project runs from its earliest phase start to its latest phase due date, whatever the list order
    const start=new Date(Math.min(...p.phases.map(x=>D(x[3])))),lastDue=new Date(Math.max(...p.phases.map(x=>D(x[4])))),end=new Date(lastDue.getTime()+DAY);
    const due=p.phases.reduce((s,[,,tot,a,b])=>{const A=D(a),B=new Date(D(b).getTime()+DAY);return s+tot*Math.max(0,Math.min(1,(NOW-A)/(B-A)))},0);
    const elapsed=Math.max(1,(NOW-start)/DAY),rate=d/elapsed,behind=Math.round((due-d)/Math.max(rate,.1));
    // series: daily [scope, merged] computed by the build from the plan history
    const series=p.series,days=Math.max(1,series.length-1);
    // no forecast from a speed of zero: nothing merged in the last 7 days means no predicted finish
    const vel=(series.at(-1)[1]-series[Math.max(0,days-7)][1])/Math.min(7,days),fin=d>=t,early=NOW<start,noFc=fin||early||vel<=0;
    const predicted=noFc?null:new Date(NOW.getTime()+Math.ceil((t-d)/vel)*DAY);
    const predDay=noFc?null:new Date(Date.UTC(predicted.getUTCFullYear(),predicted.getUTCMonth(),predicted.getUTCDate()));
    const slip=noFc?0:Math.round((predDay-lastDue)/DAY),health=fin||early?"onTrack":noFc?(NOW-lastDue>DAY?"offTrack":"atRisk"):slip>4?"offTrack":slip>=1?"atRisk":"onTrack";
    const scopes=(p.scopes||[["Whole project",p.phases.map((_,i)=>i)]]).map(([name,idx])=>{const ph=idx.map(i=>p.phases[i]);const sum=k=>ph.reduce((a,x)=>a+(x[k]||0),0);const m=sum(1),tt=sum(2),r=sum(5),x=sum(6);return {name,merged:m,inPR:r,blocked:x,todo:tt-m-r-x,total:tt,pct:tt?Math.round(100*m/tt):0}});
    return {pct:Math.round(100*d/t),d,t,health,behind,slip,start,end,lastDue,series,vel,fin,early,noFc,predicted,last,scopes};
  }
  if(p.kind==="loop"){
    let best=p.exps[0][1];p.exps.forEach(e=>{if(e[2])best=Math.max(best,e[1])});
    const pct=Math.round(100*(best-p.baseline)/(p.target-p.baseline)),la=p.lastActive||p.createdAt,idle=la?(NOW-new Date(la))/DAY:Infinity;
    const health=idle>=3&&!p.running?"stale":pct>=100?"onTrack":last?.[2]||"onTrack";
    return {best,pct,health,kept:p.exps.filter(e=>e[2]).length-1,disc:p.exps.filter(e=>!e[2]).length,idle,last};
  }
  const open=p.daily.at(-1)[0]-p.daily.at(-1)[1],old=Math.max(0,...p.items.map(i=>(NOW-D(i[2]))/DAY));
  return {open,closed:p.daily.at(-1)[1],oldest:Math.floor(old),pct:Math.round(100*p.daily.at(-1)[1]/p.daily.at(-1)[0]),health:old>RUN_MAX_AGE?"atRisk":"onTrack",last};
}
const isQuiet=p=>p.kind==="loop"&&stats(p).health==="stale"&&!agentsOf(p).some(a=>a.state!=="done");
function sortProjects(list){
  const rank=p=>{if(p.kind==="run")return 9;if(openLevers("all").some(l=>l.project===p.id))return 0;return {offTrack:1,atRisk:2,onTrack:3,stale:4}[stats(p).health]};
  return [...list].sort((a,b)=>rank(a)-rank(b)||(a.prio||9)-(b.prio||9));
}
const projOrder=prod=>{const ps=sortProjects(DATA.projects.filter(p=>p.product===prod));return [...ps.filter(p=>!isQuiet(p)),...ps.filter(isQuiet)]};

/* ---------- Linear-style atoms ---------- */
const HL={onTrack:["On track","var(--green)"],atRisk:["At risk","var(--orange)"],offTrack:["Off track","var(--red)"],stale:["No update","var(--ash)"]};
function healthIcon(h,size=14){const c=HL[h][1];
  if(h==="onTrack")return `<svg width="${size}" height="${size}" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="6" fill="none" stroke="${c}" stroke-width="1.5"/><path d="M4.3 7.2l1.8 1.8 3.6-3.8" fill="none" stroke="${c}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  if(h==="atRisk")return `<svg width="${size}" height="${size}" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="6" fill="none" stroke="${c}" stroke-width="1.5"/><path d="M7 3.8v3.8" stroke="${c}" stroke-width="1.5" stroke-linecap="round"/><circle cx="7" cy="10" r=".9" fill="${c}"/></svg>`;
  if(h==="offTrack")return `<svg width="${size}" height="${size}" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="6" fill="${c}"/><path d="M4.8 4.8l4.4 4.4M9.2 4.8l-4.4 4.4" stroke="#08090a" stroke-width="1.5" stroke-linecap="round"/></svg>`;
  return `<svg width="${size}" height="${size}" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="6" fill="none" stroke="${c}" stroke-width="1.5" stroke-dasharray="2.2 2"/></svg>`;
}
const health=h=>`<span class="health">${healthIcon(h)}${HL[h][0]}</span>`;
function pie(pct,size=14){const r=4.5,c=2*Math.PI*r;return `<svg width="${size}" height="${size}" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="6" fill="none" stroke="var(--smoke)" stroke-width="1.5"/><circle cx="7" cy="7" r="${r/2}" fill="none" stroke="var(--iris)" stroke-width="${r}" stroke-dasharray="${c/2*Math.min(1,pct/100)} ${c}" transform="rotate(-90 7 7)"/></svg>`}
function kindIcon(k){
  if(k==="build")return `<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="1.5" width="13" height="13" rx="3.5" fill="none" stroke="var(--iris)" stroke-width="1.4"/><path d="M5 10.5l2-2 1.6 1.4L11 6" fill="none" stroke="var(--iris)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  if(k==="loop")return `<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="1.5" width="13" height="13" rx="3.5" fill="none" stroke="var(--lav)" stroke-width="1.4"/><path d="M10.6 6.2A3 3 0 1 0 11 8.4" fill="none" stroke="var(--lav)" stroke-width="1.4" stroke-linecap="round"/><path d="M10.9 4.4v2.1H8.8" fill="none" stroke="var(--lav)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  return `<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="1.5" width="13" height="13" rx="3.5" fill="none" stroke="var(--teal)" stroke-width="1.4"/><path d="M5 6h6M5 8.5h6M5 11h3.5" stroke="var(--teal)" stroke-width="1.4" stroke-linecap="round"/></svg>`;
}
function leverIcon(k){
  if(k==="urgent")return `<svg class="prio" viewBox="0 0 16 16" aria-label="Needs you"><rect x="1" y="1" width="14" height="14" rx="3.5" fill="var(--red)"/><path d="M8 4.5v4.3" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/><circle cx="8" cy="11.2" r="1" fill="#fff"/></svg>`;
  if(k==="action")return `<svg class="prio" viewBox="0 0 16 16" aria-label="Action for you"><circle cx="8" cy="8" r="6.2" fill="none" stroke="var(--mist)" stroke-width="1.5"/><circle cx="8" cy="8" r="2.2" fill="var(--mist)"/></svg>`;
  return `<svg class="prio" viewBox="0 0 16 16" aria-label="Applied by default"><circle cx="8" cy="8" r="6.2" fill="none" stroke="var(--fog)" stroke-width="1.5" stroke-dasharray="2.4 2"/><path d="M5.4 8.2l1.7 1.7 3.5-3.6" fill="none" stroke="var(--fog)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
const agentChip=a=>`<span class="agent" title="${esc(a.hc)} ${esc(a.who)} · ${esc(a.provider)} ${esc(a.model)}: ${ST[a.state]}"><i class="dot d-${a.state}"></i>${esc(a.hc)}</span>`;
const chips=p=>agentsOf(p).filter(a=>a.state!=="done").map(agentChip).join("");
const leverCount=p=>{const n=openLevers("all").filter(l=>l.project===p.id).length;return n?`<span class="cnt" title="${n} waiting on you">${n}</span>`:""};
const targetOf=(p,s)=>p.kind==="build"?"due "+md(s.lastDue):p.kind==="loop"?"target "+fmtV(p.target,p.unit):"oldest "+s.oldest+"d (limit "+RUN_MAX_AGE+"d)";
function breakdown(b,big){
  const w=v=>b.total?100*v/b.total:0;
  const bar=`<div class="bd-bar" role="img" aria-label="${b.merged} merged, ${b.inPR} in PR, ${b.blocked} blocked, ${b.todo} to do of ${b.total}"><i class="m" style="width:${w(b.merged)}%"></i><i class="r" style="width:${w(b.inPR)}%"></i><i class="x" style="width:${w(b.blocked)}%"></i></div>`;
  const leg=`<div class="bd-l"><span><i style="background:var(--iris)"></i><b>${b.merged}</b> merged</span><span><i style="background:var(--lav);opacity:.75"></i><b>${b.inPR}</b> in PR</span><span><i style="background:var(--red)"></i><b>${b.blocked}</b> blocked</span><span><i style="background:var(--graphite)"></i><b>${b.todo}</b> to do <span class="ash">of ${b.total}</span></span></div>`;
  return big?`<div class="bd-big"><div class="t">${esc(b.name)}</div><div class="pct">${b.pct}%<small>merged</small></div>${bar}${leg}</div>`:bar+leg;
}

/* ---------- charts ---------- */
function projectGraph(p,s){
  const W=narrow()?340:640,H=narrow()?170:200,L=narrow()?6:30,R=12,T=18,B=26;
  const x0=new Date(Math.min(s.start,NOW)),end=new Date(Math.max(s.predicted||0,s.end,NOW)+3*DAY),span=(end-x0)/DAY;
  const X=d=>L+(W-L-R)*((d-x0)/DAY)/span,Y=v=>T+(H-T-B)*(1-v/(s.t*1.08));
  const sc=s.series.map((v,i)=>`${X(new Date(x0.getTime()+i*DAY))},${Y(v[0])}`).join(" ");
  const cp=s.series.map((v,i)=>`${X(new Date(x0.getTime()+i*DAY))},${Y(v[1])}`).join(" ");
  let g=`<line x1="${L}" x2="${W-R}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--graphite)"/>`;
  const step=7*Math.max(narrow()?2:1,Math.ceil(span/7/(narrow()?4:9)));
  for(let d=new Date(x0);d<=end;d=new Date(d.getTime()+step*DAY))g+=`<text x="${X(d)}" y="${H-8}" text-anchor="middle">${md(d)}</text>`;
  g+=`<line x1="${X(s.end)}" x2="${X(s.end)}" y1="${T}" y2="${Y(0)}" stroke="var(--smoke)" stroke-dasharray="3 3"/>${X(s.end)>W*.8?`<text x="${X(s.end)-4}" y="${T-4}" text-anchor="end">`:`<text x="${X(s.end)+4}" y="${T-4}">`}due ${md(s.lastDue)}</text>`;
  g+=`<line x1="${X(NOW)}" x2="${X(NOW)}" y1="${T}" y2="${Y(0)}" stroke="var(--fog)"/>${X(NOW)<W*.2?`<text x="${X(NOW)+4}" y="${T-4}">today</text>`:`<text x="${X(NOW)-4}" y="${T-4}" text-anchor="end">today</text>`}`;
  g+=`<polyline points="${sc}" fill="none" stroke="var(--fog)" stroke-width="1.5"/><polyline points="${X(NOW)},${Y(s.t)} ${X(end)},${Y(s.t)}" fill="none" stroke="var(--fog)" stroke-width="1.5" stroke-dasharray="3 3"/>`;
  g+=`<polygon points="${X(x0)},${Y(0)} ${cp} ${X(NOW)},${Y(0)}" fill="rgba(99,102,241,.14)"/><polyline points="${cp}" fill="none" stroke="var(--iris)" stroke-width="2"/>`;
  if(s.series.length===1)g+=`<circle cx="${X(x0)}" cy="${Y(s.series[0][1])}" r="3" fill="var(--iris)"/>`;  // one day of history draws no line
  if(!s.noFc)g+=`<line x1="${X(NOW)}" y1="${Y(s.d)}" x2="${X(s.predicted)}" y2="${Y(s.t)}" stroke="var(--iris)" stroke-width="1.5" stroke-dasharray="4 3"/><circle cx="${X(s.predicted)}" cy="${Y(s.t)}" r="3.5" fill="var(--iris)"/>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Scope ${s.t} units, ${s.d} merged, ${s.fin?"all merged":s.early?"not started":s.noFc?"no forecast":"predicted finish "+md(s.predicted)}">${g}</svg>
   <div class="key"><span><i class="line" style="background:var(--fog)"></i>Scope ${s.t} (+${p.added} since start)</span><span><i class="line" style="background:var(--iris)"></i>Merged ${s.d}${p.undatedMerged?` (${p.undatedMerged} with no PR date, counted from the start)`:""}</span>${s.noFc?"":`<span><i class="line" style="background:repeating-linear-gradient(90deg,var(--iris) 0 3px,transparent 3px 5px)"></i>Forecast at ${s.vel.toFixed(1)} units/day</span>`}</div>
   ${s.fin?`<p style="margin:8px 0 0;font-size:13px;color:var(--green)">All ${s.t} units merged.</p>`:s.early?`<p style="margin:8px 0 0;font-size:13px;color:var(--fog)">Not started: the first phase begins ${md(s.start)}.</p>`:s.noFc?`<p style="margin:8px 0 0;font-size:13px;color:var(--orange)">No forecast: nothing merged in the last 7 days.</p>`:`<p style="margin:8px 0 0;font-size:13px;color:${s.slip>0?"var(--orange)":"var(--green)"}">Predicted finish ${md(s.predicted)}: ${s.slip>0?s.slip+" day"+(s.slip>1?"s":"")+" after the "+md(s.lastDue)+" due date":"on or before the due date"}.</p>`}`;
}
function loopChart(p,big){
  const W=big&&!narrow()?640:320,H=big&&!narrow()?190:110,lo=Math.min(p.baseline,...p.exps.map(e=>e[1]))*.985,hi=p.target*1.02;
  const n=p.exps.length+(p.running?1:0),x=i=>12+i*(W-60)/Math.max(1,n-1),y=v=>H-14-(v-lo)/(hi-lo)*(H-26);
  let best=p.exps[0][1];const pts=p.exps.map((e,i)=>{if(e[2])best=Math.max(best,e[1]);return x(i)+","+y(best)});
  const endX=p.running?x(n-1):x(p.exps.length-1);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(p.metric)}: best ${fmtV(best,p.unit)}, target ${fmtV(p.target,p.unit)}">
   <line x1="0" x2="${W}" y1="${y(p.target)}" y2="${y(p.target)}" stroke="var(--green)" stroke-dasharray="3 3" opacity=".7"/><text x="${W}" y="${y(p.target)-5}" text-anchor="end">target ${fmtV(p.target,p.unit)}</text>
   <polyline fill="none" stroke="var(--iris)" stroke-width="2" points="${pts.join(" ")}"/>
   ${p.exps.map((e,i)=>`<circle cx="${x(i)}" cy="${y(e[1])}" r="${big?4:3}" fill="${e[2]?"var(--iris)":"var(--obsidian)"}" stroke="${e[2]?"var(--iris)":"var(--fog)"}" stroke-width="1.3"><title>#${i} ${esc(e[0])}: ${fmtV(e[1],p.unit)} ${e[2]?"kept":"discarded"}</title></circle>`).join("")}
   ${p.running?`<circle cx="${x(n-1)}" cy="${y(best)}" r="4.5" fill="none" stroke="var(--green)" stroke-width="1.5"><title>Running: ${esc(p.running)}</title></circle>`:""}
   <text class="v" x="${endX+8}" y="${y(best)+4}">${fmtV(best,p.unit)}</text></svg>
   <div class="key"><span><i class="line" style="background:var(--iris)"></i>best kept so far</span><span><i class="kept"></i>kept</span><span><i class="disc"></i>discarded</span>${p.running?`<span><i class="run"></i>running #${p.exps.length}</span>`:""}</div>`;
}
function cycleGraph(p,big){
  const W=big&&!narrow()?640:320,H=big&&!narrow()?170:96,n=p.daily.length,max=Math.max(1,...p.daily.map(d=>d[0]))*1.1;
  const x=i=>8+i*(W-58)/(n-1),y=v=>H-16-(v/max)*(H-24);

   <polyline points="${sc}" fill="none" stroke="var(--fog)" stroke-width="1.5"/>
   <polygon points="${x(0)},${y(0)} ${cp} ${x(n-1)},${y(0)}" fill="rgba(2,184,204,.12)"/><polyline points="${cp}" fill="none" stroke="var(--teal)" stroke-width="2"/>
   <line x1="${ex}" x2="${ex}" y1="${y(in1)}" y2="${y(cl1)}" stroke="var(--orange)" stroke-width="1.5"/><text x="${ex+5}" y="${(y(in1)+y(cl1))/2+3}" style="fill:var(--orange)">${g1} open</text>

function milestones(p,s){

function loadThreadHistory(a){
  if(!a?.thread)return;
  threadStates[a.hc]="loading";
  fetch("api/messages"+(Q?Q+"&thread=":"?thread=")+encodeURIComponent(a.thread))
    .then(r=>r.ok?r.json():Promise.reject())
    .then(list=>{agentMessages[a.hc]=list;threadStates[a.hc]="ready"})
    .catch(()=>{threadStates[a.hc]="error"})
    .finally(()=>{if(openAgent===a.hc)paintTray(a)});
}

function sendMsg(a,text,f){
  const btn=f.querySelector("button[type=submit]");
  if(btn)btn.disabled=true;
  fetch("api/messages"+Q,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({thread:a.thread,text})})
    .then(r=>r.ok?r.json():r.json().catch(()=>({})).then(b=>Promise.reject(new Error(b.error||("HTTP "+r.status)))))
    .then(entry=>{
      (agentMessages[a.hc]=agentMessages[a.hc]||[]).push(entry);
      const inp=f.querySelector("textarea");
      if(inp)inp.value="";
      const cnt=f.querySelector(".char-counter");
      if(cnt){cnt.textContent="0 / 2,000";cnt.className="char-counter"}
      paintTray(a);
      setTimeout(()=>loadThreadHistory(a),800);
    })
    .catch(err=>{alert("Failed to send message: "+err.message);if(btn&&DATA.relayConfigured)btn.disabled=!f.querySelector("textarea")?.value.trim()})
    .finally(()=>{delete f.dataset.busy});
}

function renderThread(a){
  const msgs=agentMessages[a.hc]||[];
  const tState=threadStates[a.hc]||"ready";

  let threadHtml="";
  if(tState==="loading"&&!msgs.length){
    threadHtml=`<p class="fog" style="font-size:13px;margin:8px 0">Loading…</p>`;
  } else if(tState==="error"&&!msgs.length){
    threadHtml=`<p class="fog" style="font-size:13px;margin:8px 0">Could not load history. <button class="btn sm" type="button" data-retry-history="${esc(a.hc)}">Retry</button></p>`;
  } else if(!msgs.length){
    threadHtml=`<div class="thread-empty">
      <svg width="22" height="22" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M2.5 3.5h11a1 1 0 0 1 1 1v7a1 1 0 0 1-1 1H5.5l-3 2.5V4.5a1 1 0 0 1 1-1z"/></svg>
      <div class="empty-title">No messages in this session yet</div>
      <div class="empty-sub">Messages sent here wake the agent immediately and appear in its active session log.</div>
    </div>`;
  } else {
    threadHtml=`<div class="msg-thread-list">${[...msgs].reverse().map(m=>{
      const isAns=m.kind!=="message";
      const isDelivered=m.state==="delivered";
      const isSent=m.state==="sent";
      const isStale=m.state==="stale";
      const isFailed=m.state==="failed"||Boolean(m.lastError&&!isDelivered);
      const badge=isFailed?`<span class="msg-badge failed"><svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="8" r="6"/><path d="M8 5v3.5M8 11.5h.01"/></svg>${isStale?'Stale':'Failed'}</span>`:
        isDelivered?`<span class="msg-badge delivered" title="Seen in the session"><svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M1.5 8.5l3 3 5.5-6M6.5 11.5l3 3 5.5-6"/></svg>Delivered</span>`:
        isSent?`<span class="msg-badge sent" title="T3 accepted"><svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8.5l3.5 3.5 6.5-7"/></svg>Sent</span>`:
        isStale?`<span class="msg-badge failed">Stale</span>`:
        `<span class="msg-badge queued"><svg class="spin" width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="8" r="6" stroke-dasharray="10 16"/></svg>Queued</span>`;
      return `<div class="msg-item ${isAns?'decision':''} ${isFailed||isStale?'failed':''}" data-msg-id="${esc(m.id)}">
        <div class="msg-item-top">
          ${isAns?`<span class="msg-badge decision-tag"><svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5.4 8.2l1.7 1.7 3.5-3.6" stroke-linecap="round"/></svg>Decision answered</span>${m.itemId?`<span class="mono" style="font-size:11px;color:var(--mist);font-weight:510">${esc(m.itemId)}</span>`:''}`:`<span class="msg-sender"><svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="5.5" r="2.5"/><path d="M3 13.5c.8-2.6 2.7-3.8 5-3.8s4.2 1.2 5 3.8"/></svg>Owner</span>`}
          ${badge}
          <span class="msg-time">${hm(m.at)} UTC (${ago(m.at)} ago)</span>
        </div>
        <div class="msg-body" ${isAns?'style="font-weight:510;color:var(--paper)"':''}>${esc(m.raw||m.text)}</div>
        ${m.note?`<div class="msg-note">${esc(m.note)}</div>`:''}
        ${isFailed?`<div class="msg-fail-box"><span><b>Reason:</b> ${esc(m.lastError)}</span>${!isStale?`<button class="btn sm" type="button" data-retry-msg="${esc(m.id)}" data-retry-agent="${esc(a.hc)}"><svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2.5 8a5.5 5.5 0 1 0 1.6-3.9L2 6M2 2v4h4"/></svg>Retry</button>`:''}</div>`:''}
      </div>`;
    }).join("")}</div>`;
  }
  return `<div class="msg-thread-h">
    <span><b>Delivery thread</b> · ${msgs.length} message${msgs.length===1?'':'s'}</span>
  </div>
  ${threadHtml}`;
}

/* ---------- Tokens View ---------- */
let tokPeriod="7d",showAllTokens=false;
function viewTokens(prod){
  const tokWarnings = DATA.tokenWarnings || [];
  const sourcesLoaded = DATA.tokenSourcesLoaded ?? (DATA.tokenHistory?.sourcesLoaded ?? ((DATA.tokenHistory?.["24h"]?.bars || []).some(b => b.total > 0) || (DATA.tokenHistory?.["30d"]?.tot || 0) > 0));

  if (!sourcesLoaded && tokWarnings.length) {
    return `<div class="err-box" style="margin-top:16px">
      <div class="err-title">${ic("info")} Token telemetry error</div>
      ${tokWarnings.map(w=>`<p class="err-desc">${esc(w)}</p>`).join("")}
    </div>`;
  }

  const warnBanner = tokWarnings.length ? `<div class="unmetered-banner" style="border-left-color:var(--orange);margin-top:16px">
    <div class="unmetered-title">${ic("info")} Telemetry source warning${tokWarnings.length > 1 ? "s" : ""}</div>
    ${tokWarnings.map(w=>`<p class="unmetered-desc">${esc(w)}</p>`).join("")}
  </div>` : "";

  const h=DATA.tokenHistory?.[tokPeriod]||DATA.tokenHistory?.["7d"]||DATA.tokenHistory?.["24h"]||{tot:0,input:0,output:0,cache:0,cache_write:0,cost:null,byProvider:{},bars:[]};
  if(!h.tot&&!(h.bars||[]).some(b=>b.total>0)){
    return `${warnBanner}<div class="box" style="margin-top:16px"><p class="fog" style="font-size:13px;margin:0">No token telemetry recorded in the selected period (${tokPeriod}). Active agent sessions stream token events into telemetry stores.</p></div>`;
  }

  const maxVal=Math.max(1,...(h.bars||[]).map(b=>b.total))*1.15;

  const chartW=680,chartH=170,padL=45,padR=15,padT=15,padB=30;
  const plotW=chartW-padL-padR,plotH=chartH-padT-padB;
  const nBars=(h.bars||[]).length||1;
  const barSlot=plotW/nBars;
  const barW=Math.min(36,Math.max(6,barSlot*0.55));

  const yLines=[0,0.33,0.66,1].map(pct=>{
    const yVal=pct*maxVal;
    const yPos=padT+plotH*(1-pct);
    return {yVal,yPos,label:pct===0?"0":fmtTok(yVal)};
  });

  const svgBars=(h.bars||[]).map((b,i)=>{
    const x=padL+i*barSlot+(barSlot-barW)/2;
    let curY=padT+plotH;
    const rects=[];
    const provs=b.providers||{};
    for(const [p,val] of Object.entries(provs)){
      if(val<=0)continue;
      const height=(val/maxVal)*plotH;
      curY-=height;
      const color=(DATA.provColors&&DATA.provColors[p])||"var(--ash)";
      rects.push(`<rect x="${x}" y="${curY}" width="${barW}" height="${Math.max(1,height)}" fill="${color}" rx="2"/>`);
    }
    const provDetails=Object.entries(provs).filter(([,v])=>v>0).map(([p,v])=>p+" "+fmtTok(v)).join(", ");
    const tip=`${b.label}: Total ${fmtTok(b.total)}${provDetails?" ("+provDetails+")":""}`;
    return `<g class="chart-bar-group">
      <title>${esc(tip)}</title>
      ${rects.join("")}
      <text x="${x+barW/2}" y="${chartH-10}" text-anchor="middle" fill="var(--fog)" font-size="10" font-family="var(--mono)">${esc(b.label)}</text>
    </g>`;
  }).join("");

  const svgGrid=yLines.map(yl=>`
    <line x1="${padL}" y1="${yl.yPos}" x2="${chartW-padR}" y2="${yl.yPos}" stroke="rgba(255,255,255,0.07)" stroke-dasharray="3,3"/>
    <text x="${padL-8}" y="${yl.yPos+4}" text-anchor="end" fill="var(--ash)" font-size="10" font-family="var(--mono)">${yl.label}</text>
  `).join("");

  const rawAgList=h.agents||(DATA.agentTokens?.[tokPeriod])||DATA.agentTokens||[];
  const agList=rawAgList.filter(a=>{
    if(prod==="all")return true;
    if(!a.project)return false;
    const p=proj(a.project);
    return p&&p.product===prod;
  });

  agList.sort((a,b)=>{
    const wa=(a.windows&&a.windows[tokPeriod])?a.windows[tokPeriod]:a;
    const wb=(b.windows&&b.windows[tokPeriod])?b.windows[tokPeriod]:b;
    const unA=wa.unmetered||wa.tot==null;
    const unB=wb.unmetered||wb.tot==null;
    if(unA!==unB)return unA?1:-1;
    return (wb.tot||0)-(wa.tot||0);
  });

  const TOP_N=10;
  const displayedList=showAllTokens?agList:agList.slice(0,TOP_N);

  const costStr=fmtCost(h.cost);
  const eurRate=DATA.eurUsdRate||0.92;
  const costEurStr=h.cost!=null?`~ ${(h.cost*eurRate).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})} € at fixed FX`:"No cost telemetry";
  const provBreakdown=Object.entries(h.byProvider||{}).filter(([,n])=>n>0).map(([p,n])=>`${p} ${fmtTok(n)}`).join(" · ")||"No telemetry in window";
  const outPct=(h.input+h.output)>0?Math.round(100*h.output/(h.input+h.output)):0;
  const promptDenom=(h.input||0)+(h.cache||0)+(h.cache_write||0);
  const cachePct=promptDenom>0?Math.round(100*(h.cache||0)/promptDenom):0;

  return `${warnBanner}<div class="tok-kpis">
    <div class="tok-kpi">
      <div class="lbl">Recorded tokens (${tokPeriod})</div>
      <div class="val">${fmtTok(h.tot||0)}</div>
      <div class="sub">${esc(provBreakdown)}</div>
    </div>
    <div class="tok-kpi">
      <div class="lbl">Input / Cache write</div>
      <div class="val">${fmtTok(h.input||0)} <span style="font-size:14px;color:var(--fog)">/ ${fmtTok(h.cache_write||0)}</span></div>
      <div class="sub">${fmtTok(h.input||0)} uncached input · ${fmtTok(h.cache_write||0)} cache write</div>
    </div>
    <div class="tok-kpi">
      <div class="lbl">Output / Cache read</div>
      <div class="val">${fmtTok(h.output||0)} <span style="font-size:14px;color:var(--fog)">/ ${fmtTok(h.cache||0)}</span></div>
      <div class="sub">${outPct}% output · ${cachePct}% cache hit read</div>
    </div>
    <div class="tok-kpi">
      <div class="lbl">Estimated cost <span style="font-size:10px;color:var(--ash);font-weight:400">(priced only)</span></div>
      <div class="val">${costStr}</div>
      <div class="sub">${costEurStr}${h.unpriced?`<div style="margin-top:2px;color:var(--ash)">priced tokens only · ${fmtTok(h.unpriced)} unpriced</div>`:""}</div>
    </div>
  </div>

  <div class="chart-panel">
    <div class="chart-top">
      <h2>${tokPeriod==="24h"?"Tokens (last 24 h, UTC)":"Tokens per day (UTC)"} <span class="ct">${fmtTok(h.tot||0)}</span></h2>
      <div class="time-pills" id="tokTimePills">
        <button type="button" class="time-pill" data-period="24h" ${tokPeriod==="24h"?'aria-current="true"':""}>24 h</button>
        <button type="button" class="time-pill" data-period="7d" ${tokPeriod==="7d"?'aria-current="true"':""}>7 d</button>
        <button type="button" class="time-pill" data-period="30d" ${tokPeriod==="30d"?'aria-current="true"':""}>30 d</button>
      </div>
    </div>
    <div class="chart-svg-wrap">
      <svg viewBox="0 0 ${chartW} ${chartH}" class="chart-svg" aria-label="Stacked tokens bar chart">${svgGrid}${svgBars}</svg>
    </div>
    <div class="chart-key" aria-label="Chart key">
      ${Object.entries(h.byProvider||{}).map(([p,n])=>{
        const color=(DATA.provColors&&DATA.provColors[p])||"var(--ash)";
        const pct=h.tot>0?Math.round(100*n/h.tot):0;
        return `<span class="chart-key-item"><i style="background:${color}"></i>${esc(p)} (${fmtTok(n)}${pct?` · ${pct}%`:""})</span>`;
      }).join("")}
    </div>
  </div>

  <div class="unmetered-banner">
    <div class="unmetered-title">${ic("info")} Token telemetry &amp; agents outside T3</div>
    <p class="unmetered-desc">
      Token telemetry is read from Claude's usage scan cache, Antigravity conversation protobufs, and OpenCode SQLite message records linked to T3 threads by native ID. Native subagents are attributed as counted in their parent session. Agents created outside T3 (via factory CLI) or threads without recorded native sessions show “No data”. Cost estimates are in USD and EUR based on the documented model price table and fixed ${eurRate} FX constant.
    </p>
  </div>

  <div class="box" style="padding:6px 6px">
    <table class="tbl stack">
      <thead>
        <tr>
          <th>Agent</th>
          <th>Provider</th>
          <th>Model</th>
          <th class="num">Input</th>
          <th class="num">Output</th>
          <th class="num">Cache write</th>
          <th class="num">Cache read</th>
          <th class="num">Est. cost</th>
        </tr>
      </thead>
      <tbody>
        ${displayedList.length?displayedList.map(a=>{
          const w=(a.windows&&a.windows[tokPeriod])?a.windows[tokPeriod]:a;
          const isUn=w.unmetered;
          const pDenom=(w.input||0)+(w.cache||0)+(w.cache_write||0);
          const cPct=pDenom>0?Math.round(100*(w.cache||0)/pDenom):0;
          const pObj=a.project?proj(a.project):null;
          const parentHandle=w.parent||a.parent;
          return `<tr>
            <td>
              <div style="display:flex;align-items:center;gap:6px">
                <span class="badge" style="font-family:var(--mono)">${esc(a.hc)}</span>
                <span style="font-weight:510;color:var(--paper)">${esc(a.who)}</span>
                ${a.project?`<a href="#/p/${esc(a.project)}" style="margin-left:auto;font-size:12px;color:var(--fog);text-decoration:underline;text-underline-offset:2px">${esc(pObj?.name||a.project)}</a>`:""}
              </div>
            </td>
            <td><span style="color:var(--mist)">${esc(a.provider)}</span></td>
            <td><span class="mono fog">${esc(a.model||"—")}</span></td>
            <td class="num mono">${isUn?(parentHandle?`<span class="badge-unmetered" title="Tokens counted in parent session ${esc(parentHandle)}">counted in parent ${esc(parentHandle)}</span>`:`<span class="badge-unmetered" title="${esc(w.why||"")}">No data</span>`):fmtTok(w.input||0)}</td>
            <td class="num mono">${isUn?`<span class="fog">—</span>`:fmtTok(w.output||0)}</td>
            <td class="num mono">${isUn?`<span class="fog">—</span>`:fmtTok(w.cache_write||0)}</td>
            <td class="num mono">${isUn?`<span class="fog">—</span>`:`${fmtTok(w.cache||0)} <span class="sm ash">(${cPct}%)</span>`}</td>
            <td class="num mono" style="${isUn||w.cost==null?"":"color:var(--paper);font-weight:510"}">${isUn||w.cost==null?`<span class="fog">—</span>`:fmtCost(w.cost)}</td>
          </tr>`;
        }).join(""):`<tr><td colspan="8" class="fog" style="text-align:center;padding:16px">No agents recorded for this product.</td></tr>`}
      </tbody>
    </table>
    ${agList.length>TOP_N?`<div style="padding:8px;text-align:center">
      <button type="button" class="btn" data-tok-toggle="all">${showAllTokens?"Show top 10":`Show all (${agList.length} agents)`}</button>
    </div>`:""}
  </div>`;
}

/* --- Skills View --- */
let skillQuery = "";
let skillGroup = "all";

function viewSkills(prod){
  if(!DATA.skills || !DATA.skills.length){
    const skillWarn = (DATA.warnings || []).find(w => w.toLowerCase().includes("skill"));
    if(skillWarn){
      return `<div class="err-box" style="margin-top:16px">
        <div class="err-title"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6"/><path d="M8 5v3.5M8 11v.5" stroke-linecap="round"/></svg> Skills registry unavailable</div>
        <p class="err-desc">${esc(skillWarn)}</p>
      </div>`;
    }
    return `<div class="box" style="margin-top:16px"><p class="fog" style="font-size:13px;margin:0">No skills configured in registry. Add skills to <span class="mono">~/.claude/skills</span> or <span class="mono">.agents/skills</span> to make them available to agents.</p></div>`;
  }

  const grpNames = {
    all:"All",
    orchestration:"Orchestration",
    review:"Quality & Review",
    operations:"Operations",
    platform:"Platform & Frameworks",
    browsing:"Browsing & Research",
    design:"Design & Frontend",
    security:"Security & Secrets",
    other:"Other"
  };

  const list = DATA.skills.filter(s => {
    const mG = skillGroup === "all" || s.group === skillGroup;
    if(!mG) return false;
    if(!skillQuery) return true;
    const q = skillQuery.toLowerCase();
    return s.name.toLowerCase().includes(q) ||
           (s.source && s.source.toLowerCase().includes(q)) ||
           (s.desc && s.desc.toLowerCase().includes(q)) ||
           (s.triggers && s.triggers.some(t => t.toLowerCase().includes(q))) ||
           (s.agents && s.agents.some(a => a.toLowerCase().includes(q))) ||
           (s.providers && s.providers.some(p => p.toLowerCase().includes(q)));
  });

  const grpCounts = {};

      ? s.providers.map(p => `<span class="skill-chip">${esc(p)}</span>`).join("")
      : "";
    const usedByContent = chipsHtml || provChips || `<span class="fog" style="font-size:11px">—</span>`;

        <span class="skill-src-tag">${esc(s.source || "local")}</span>
        <span class="skill-grp-tag">${esc(s.groupLabel || grpNames[s.group] || s.group)}</span>
        <span class="skill-time">${timeStr}</span>
      </div>
      <p class="skill-desc">${esc(s.desc || "")}</p>
      <div class="skill-foot">
        <div class="skill-agents">
          <span class="fog" style="font-size:11px;margin-right:2px">Used by:</span>
          ${usedByContent}
        </div>
        <div class="skill-triggers">
          ${(s.triggers || []).map(t => `<span class="trig-tag">${esc(t)}</span>`).join("")}
        </div>
      </div>
    </div>`;
  };

  return `<div class="skills-controls">
    <div class="skills-search">
      ${ic("search")}
      <input type="text" id="skillSearch" placeholder="Search skills, triggers, agents…" value="${esc(skillQuery)}" autocomplete="off" spellcheck="false">
      ${skillQuery ? `<button class="clear-search-btn" id="clearSkillSearch" type="button" aria-label="Clear search">${ic("close")}</button>` : ""}
    </div>
    <div class="filter-tabs" id="skillGroupTabs">
      ${allGroups.map(g => `<button type="button" class="filter-tab" data-grp="${g}" ${skillGroup === g ? 'aria-current="true"' : ""}>${grpNames[g] || g} <span class="tab-ct">${g === "all" ? DATA.skills.length : (grpCounts[g] || 0)}</span></button>`).join("")}
    </div>
  </div>
  ${list.length ? `
    <div class="skills-sec-title"><span>Skills Registry · ${list.length} skill${list.length > 1 ? "s" : ""}${skillGroup !== "all" ? ` in ${grpNames[skillGroup] || skillGroup}` : ""}</span></div>
    <div class="skills-grid">${list.map(renderCard).join("")}</div>
  ` : `
    <div class="box" style="margin-top:16px;text-align:center;padding:32px 16px">
      <p class="fog" style="font-size:13px;margin:0 0 10px">No skills match “<b>${esc(skillQuery)}</b>”${skillGroup !== "all" ? ` in ${grpNames[skillGroup] || skillGroup}` : ""}.</p>
      <button class="btn" type="button" id="resetSkillFilter">Clear filters</button>
    </div>
  `}`;
}

/* --- Prototypes View --- */
const PROTO_STATUS={waiting:0,validated:1,"sent-back":2,built:3,superseded:4};
const PROTO_LABEL={all:"All",waiting:"Waiting for you",validated:"Validated","sent-back":"Sent back",built:"Built",superseded:"Superseded"};
const protoDot=st=>st==="waiting"?"d-waiting":st==="validated"?"d-running":st==="sent-back"?"d-failed":"d-done";
let openProto=null,protoStatus="all",protoSearch="";
const protoExpanded=new Set();
const protoLatest=p=>p.versions&&p.versions[0]?p.versions[0]:{};
let toastTimer=null;
function toast(msg){const el=$("#toast");if(!el)return;el.textContent=msg;el.style.display="block";clearTimeout(toastTimer);toastTimer=setTimeout(()=>{el.style.display="none"},2500);}

function viewProtos(prod){
  if(DATA.protoError){
    return `<div class="banner stop" style="margin-top:16px">
      <div style="display:flex;align-items:center;gap:8px;font-weight:510;color:var(--paper);margin-bottom:4px"><i class="dot d-failed"></i>Could not read protos</div>
      <p class="fog" style="font-size:13px;margin:0">The list is hidden until <span class="mono">protos.json</span> in the factory home is fixed or restored. <span class="mono">${esc(DATA.protoError)}</span></p>
    </div>`;
  }
  const all=(DATA.protos||[]).filter(p=>p.versions&&p.versions.length);
  const matches=p=>{
    const v=protoLatest(p);
    if(prod!=="all"&&p.product!==prod)return false;
    if(protoStatus!=="all"&&v.status!==protoStatus)return false;
    if(protoSearch){
      const q=protoSearch.toLowerCase();
      const pname=((DATA.products[p.product]||{}).name||p.product||"").toLowerCase();
      if(!String(p.feature||"").toLowerCase().includes(q)&&!pname.includes(q)&&!String(v.agent||"").toLowerCase().includes(q)&&!String(p.project||"").toLowerCase().includes(q))return false;
    }
    return true;
  };
  const list=all.filter(matches).sort((a,b)=>{
    const sa=PROTO_STATUS[protoLatest(a).status]??99,sb=PROTO_STATUS[protoLatest(b).status]??99;
    if(sa!==sb)return sa-sb;
    return String(protoLatest(b).date||"").localeCompare(String(protoLatest(a).date||""));
  });
  const waiting=all.filter(p=>(prod==="all"||p.product===prod)&&protoLatest(p).status==="waiting").length;
  const statusTabs=Object.keys(PROTO_LABEL).map(s=>`<button type="button" data-pstat="${s}" aria-selected="${protoStatus===s}">${PROTO_LABEL[s]}${s==="waiting"&&waiting?` <span class="cnt">${waiting}</span>`:""}</button>`).join("");
  let listHtml;
  if(!all.length){
    listHtml=`<div class="list"><div style="padding:48px 16px;text-align:center">
      <h2 style="justify-content:center;font-size:15px;color:var(--paper)">No prototypes yet</h2>
      <p class="fog" style="font-size:13px;margin:6px 0 14px">Agents add one with <span class="mono">factory proto add</span>.</p>
    </div></div>`;
  }else if(!list.length){
    listHtml=`<div class="list"><div style="padding:48px 16px;text-align:center">
      <h2 style="justify-content:center;font-size:15px;color:var(--paper)">No prototypes match</h2>
      <p class="fog" style="font-size:13px;margin:6px 0 14px">Try a different filter or search term.</p>
      <button type="button" class="btn" id="protoClearFilters">Clear filters</button>
    </div></div>`;
  }else{
    listHtml=`<div class="list">${list.map(renderProtoRow).join("")}</div>`;
  }
  return `<div>
    <div class="proto-toolbar"><div class="seg" role="tablist" aria-label="Filter by status">${statusTabs}</div>
      <div class="search-wrap">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.3"/><path d="M10.5 10.5l3 3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        <input type="search" class="input" id="protoSearch" placeholder="Search by name, product, agent…" value="${esc(protoSearch)}" autocomplete="off" spellcheck="false">
      </div>
    </div>
    ${listHtml}
  </div>`;
}

function renderProtoRow(proto){
  const latest=proto.versions[0];
  const older=proto.versions.slice(1);
  const hasOlder=older.length>0;
  const expanded=protoExpanded.has(proto.id);
  const prod=DATA.products[proto.product]||{name:proto.product||"?"};
  const olderToggle=hasOlder?`<button type="button" class="linkbtn" data-vtoggle="${esc(proto.id)}">${expanded?"Hide older":older.length+" older version"+(older.length>1?"s":"")}</button>`:"";
  const mainRow=`<div class="lrow proto-lrow" role="row" tabindex="0" data-popen="${esc(proto.id)}">
    <i class="dot ${protoDot(latest.status)}"></i>
    <span class="nm">${esc(proto.feature)}</span>
    <span class="mono fog">${esc(proto.project||"—")}</span>
    <span class="sub"><span class="fog">${esc(prod.name)}</span>${latest.agent?`<span class="agent"><i class="dot ${protoDot(latest.status)}"></i>${esc(latest.agent)}</span>`:""}<span class="mono" style="font-size:12px;color:var(--fog)">v${latest.v}</span>${olderToggle}</span>
    <span class="date">${ago(latest.date)}</span>
  </div>`;
  const olderRows=(hasOlder&&expanded)?older.map(v=>`<div class="lrow proto-lrow older-row" role="row" tabindex="0" data-popen="${esc(proto.id)}">
    <i class="dot ${protoDot(v.status)}"></i>
    <span class="nm" style="font-weight:400;color:var(--mist)">${esc(proto.feature)} <span class="mono ash">v${v.v}</span></span>
    <span class="mono ash">${esc(proto.project||"—")}</span>
    <span class="sub">${v.agent?`<span class="agent"><i class="dot ${protoDot(v.status)}"></i>${esc(v.agent)}</span>`:""}</span>
    <span class="date">${ago(v.date)}</span>
  </div>`).join(""):"";
  return mainRow+olderRows;
}

  ${v.look_at&&v.look_at.length?`<div class="box"><h2>What to look at</h2><ul style="margin:0;padding-left:18px;font-size:13px;line-height:1.7;color:var(--mist)">${v.look_at.map(b=>`<li>${esc(b)}</li>`).join("")}</ul></div>`:""}
  ${v.decisions&&v.decisions.length?`<div class="box"><h2>Decisions recorded</h2><ul style="margin:0;padding-left:18px;font-size:13px;line-height:1.7;color:var(--mist)">${v.decisions.map(d=>`<li>${esc(d)}</li>`).join("")}</ul></div>`:""}

  <div class="box"><h2>Version history <span class="ct">${proto.versions.length}</span></h2>${proto.versions.map(x=>`<div class="mrow"><i class="dot ${protoDot(x.status)}"></i><span style="font-weight:510;color:var(--paper)"><span class="mono">v${x.v}</span></span><span class="fog" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px">${esc((x.note||"").slice(0,48))}${(x.note||"").length>48?"...":""}</span><span class="mono ash" style="margin-left:auto;font-size:12px">${ago(x.date)}</span></div>`).join("")}</div>
  <div class="box"><h2>Links</h2><div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center">
    <a class="btn" href="${esc(v.file||"")}?t=${esc(v.token||"")}" target="_blank" rel="noopener"><svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M5 2H2v8h8V7M7 2h3v3M10 2L5.5 6.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>Open prototype</a>
    ${v.pr?`<span class="badge mono">PR #${esc(v.pr)}</span>`:""}
  </div></div>
  ${isWaiting?`<div class="box" id="protoActions">
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <button type="button" class="btn primary" data-pvalidate="${esc(proto.id)}">Validate</button>
      <button type="button" class="btn" data-psbtoggle>Send back</button>
    </div>
    <div id="protoSbArea" style="display:none;margin-top:12px">
      <div style="display:grid;gap:6px;margin:0 0 8px">
        <label for="protoSbReason" style="font-size:12px;color:var(--fog)">Describe what to change (required)</label>
        <textarea id="protoSbReason" placeholder="Feedback for the agent…" style="height:80px"></textarea>
        <div id="protoSbErr" class="err" style="display:none">Please describe what to change before sending back.</div>
      </div>
      <div style="display:flex;gap:8px">
        <button type="button" class="btn" data-psendback="${esc(proto.id)}">Send back with note</button>
        <button type="button" class="btn" data-psbtoggle>Cancel</button>
      </div>
    </div>
  </div>`:""}`;
}

function openProtoDrawer(id){openProto=id;syncProtoDrawer();}
function closeProtoDrawer(){openProto=null;const t=$("#protoSbReason");if(t)t.value="";const dw=$("#protoDrawer");if(dw&&dw.open)dw.close();}
function syncProtoDrawer(){
  const dw=$("#protoDrawer");
  if(!dw)return;
  if(!openProto){if(dw.open)dw.close();return}
  const proto=DATA.protos.find(p=>p.id===openProto);
  if(!proto||!proto.versions.length){if(dw.open)dw.close();return}
  const v=proto.versions[0];
  const prod=DATA.products[proto.product]||{name:proto.product||"?"};
  // a re-render (inbox poll, filter click) must not drop a send-back reason being typed
  const ta=$("#protoSbReason"),keep=ta&&dw.open&&dw.dataset.id===proto.id?{text:ta.value,shown:$("#protoSbArea").style.display==="block"}:null;
  $("#protoDwTitle").innerHTML=`${esc(prod.name)} › <b>${esc(proto.feature)}</b>`;
  $("#protoDwSlide").innerHTML=renderProtoDrawer(proto,v,prod);
  dw.dataset.id=proto.id;
  if(keep&&$("#protoSbReason")){$("#protoSbReason").value=keep.text;if(keep.shown)$("#protoSbArea").style.display="block"}
  if(!dw.open)dw.showModal();
}
function toggleProtoSb(){
  const a=$("#protoSbArea");
  if(!a)return;
  const show=a.style.display==="none"||a.style.display==="";
  a.style.display=show?"block":"none";
  if(!show){const t=$("#protoSbReason");if(t)t.value=""}
  if(show){const t=$("#protoSbReason");if(t)t.focus()}
}
function doProtoAction(id,action){
  let reason="";
  if(action==="sendback"){
    const ta=$("#protoSbReason");
    reason=(ta?ta.value:"").trim();
    if(!reason){const err=$("#protoSbErr");if(err)err.style.display="block";if(ta){ta.style.borderColor="var(--red)";ta.focus()}return}
  }
  fetch("api/protos"+Q,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id,v:(DATA.protos.find(p=>p.id===id)||{versions:[{}]}).versions[0].v,action,reason})})
    .then(r=>r.json().catch(()=>({})).then(b=>{
      const proto=DATA.protos.find(p=>p.id===id);
      const same=b.version&&proto&&b.version.v===proto.versions[0].v;
      if(same)proto.versions[0]={...b.version,token:proto.versions[0].token};
      if(r.status===409){render();toast(same?"Already decided: "+b.error:`Not saved: ${b.error}. It shows here after the next build (up to 10 min).`);return}
      if(!r.ok)throw new Error(b.error||("HTTP "+r.status));
      render();
      toast(b.delivered?(action==="validate"?"Sent to the agent: validated":"Sent to the agent with your note"):`Saved (${b.why||"no message sent"})`);
    }))
    .catch(err=>{alert("Not saved: "+err.message)});
}

/* --- Autopilot (Automation) View --- */
const AP_DOT={running:"d-running",waiting:"d-waiting",stalled:"d-stalled",done:"d-done",failed:"d-failed",quota:"d-quota",unknown:"d-unknown",gone:"d-done"};
const AP_STATE_LABEL={running:"Working",waiting:"Waiting on you",stalled:"Working",done:"Idle",failed:"Failed: check the session",quota:"Quota blocked",unknown:"Unknown",gone:"Thread gone"};
const AP_NUDGE={warm:["Same session (warm)",""],inbox:["Goes to your inbox: touches production","color:var(--orange)"],off:["Off","color:var(--ash)"],gone:["Thread gone","color:var(--ash)"],skip:["Stopped: done criteria met","color:var(--ash)"]};
const AP_EVERY=[1,3,6,12,24];
let apMode=null,apEditing=null,apPendingSend=null;
const apProject=pid=>(DATA.autopilot&&DATA.autopilot.projects||[]).find(p=>p.project===pid);
const apStateOf=thread=>{const a=(DATA.agents||[]).find(x=>x.thread===thread)||((DATA.autopilot&&DATA.autopilot.sessions)||[]).find(x=>x.thread===thread);return a?{state:a.state,stateLabel:AP_STATE_LABEL[a.state]||a.state,idle_since:a.since,tokens:a.tokens}:{state:"gone",stateLabel:"Thread gone",idle_since:null,tokens:null}};
const apEveryOpts=sel=>AP_EVERY.map(h=>`<option value="${h}" ${h===sel?"selected":""}>Every ${h} hour${h>1?"s":""}</option>`).join("");

function viewAutomation(prod){
  const seg=`<nav class="seg" role="tablist" aria-label="Automation sections" style="margin:12px 0 6px">
    <button type="button" data-autotab="board" aria-selected="${autoTab==='board'}">Board</button>

  return seg + (autoTab==='board' ? viewBoard(prod) : viewAutopilotTab(prod));
}

function viewAutopilotTab(prod){
  const ap=DATA.autopilot;
  if(ap&&ap.error){
    return `<div class="banner stop" style="margin-top:16px">
      <div style="display:flex;align-items:center;gap:8px;font-weight:510;color:var(--paper);margin-bottom:4px"><i class="dot d-failed"></i>Could not read autopilot</div>
      <p class="fog" style="font-size:13px;margin:0">Autopilot is hidden until <span class="mono">autopilot.json</span> in the factory home is fixed or restored. <span class="mono">${esc(ap.error)}</span></p>
    </div>`;
  }
  const t3Error=Boolean(ap&&ap.t3Error);
  const projects=(ap&&ap.projects||[]).filter(p=>prod==="all"||((DATA.projects.find(x=>x.id===p.project)||{}).product===prod));
  const paused=Boolean(ap&&ap.paused);
  const t3Banner=t3Error?`<div class="banner stop" role="status" style="margin:16px 0 0">
      <div style="display:flex;align-items:center;gap:8px;font-weight:510;color:var(--paper);margin-bottom:4px"><i class="dot d-failed"></i>T3 sessions unreachable</div>
      <p class="fog" style="font-size:13px;margin:0">${esc(ap.t3Error)}</p>
      <button class="btn" type="button" style="margin-top:14px" data-ap-retry>Retry</button>
    </div>`:"";
  const pauseBanner=paused?`<div class="banner stop" role="status" style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin:16px 0 0">
      <div style="display:flex;align-items:center;gap:8px">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" style="flex:none;color:var(--red)"><rect x="3" y="2.5" width="2.6" height="9" rx=".8" fill="currentColor"/><rect x="8.4" y="2.5" width="2.6" height="9" rx=".8" fill="currentColor"/></svg>
        <span>All automations paused${ap.pausedAt?` at ${hm(ap.pausedAt)}`:""}</span>
      </div>
      <button class="btn" type="button" data-ap-resume>Resume</button>
    </div>`:"";
  const header=`<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin:16px 0 14px;flex-wrap:wrap">
    <div>
      <div style="font-size:14px;font-weight:510;color:var(--paper)">Project autopilot</div>
      <div class="fog" style="font-size:12px">Opt-in per project. Skips sessions waiting on you or actively working.</div>
    </div>
    <div style="display:flex;gap:8px">
      ${paused?"":`<button class="btn" type="button" data-ap-pause>Pause all</button>`}
      <button class="btn primary" type="button" data-ap-add>+ Add project</button>
    </div>
  </div>`;
  const empty=`<div class="box empty" style="text-align:center;padding:48px 16px">
      <h2 style="justify-content:center;margin-bottom:8px">No projects on autopilot</h2>
      <p class="fog" style="font-size:13px">Add a project to send scheduled progress nudges to its active T3 session.</p>

    </div>`;
  const table=`<div class="box" style="padding:0;overflow:hidden"><table class="tbl stack"><thead><tr>
      <th>Project / session</th><th>State</th><th>Done criteria</th><th>Context</th><th>Last run</th><th>Next nudge</th><th style="text-align:right">Autopilot</th>
    </tr></thead><tbody>${projects.map(apRow).join("")}</tbody></table></div>`;

  return `${t3Banner}${pauseBanner}${header}
    <div class="banner" style="margin:0 0 16px;color:var(--fog);line-height:1.5">

}

function apRow(p){
  const name=(DATA.projects.find(x=>x.id===p.project)||{name:p.project}).name;
  const nudge=AP_NUDGE[p.nudge]||AP_NUDGE.warm;

    <td data-label="Project / session"><span class="nm" style="font-weight:510;color:var(--paper)">${esc(name)}</span><br><span class="mono fog" style="font-size:11px">${esc(p.thread||"—")}</span></td>

function apFillThreads(pid){
  const sel=$("#apAddThread");if(!sel)return;
  // this project's sessions first, then the rest of its product (a title that matches no project)
  const all=(DATA.autopilot&&DATA.autopilot.sessions)||[];
  const prod=((DATA.projects||[]).find(p=>p.id===pid)||{}).product;
  const taken=new Set(((DATA.autopilot&&DATA.autopilot.projects)||[]).map(p=>p.thread));  // one session, one goal
  const free=all.filter(s=>!taken.has(s.thread));
  const mine=free.filter(s=>s.project===pid), other=free.filter(s=>s.project!==pid&&s.product===prod).slice(0,30);
  const outside=free.filter(s=>!s.product).slice(0,30);  // started outside every product's folder
  const opt=s=>`<option value="${esc(s.thread)}">${esc(s.hc||"")} · ${esc(s.task)} (${esc(s.state)})</option>`;
  const group=(label,list)=>list.length?`<optgroup label="${esc(label)}">${list.map(opt).join("")}</optgroup>`:"";
  sel.innerHTML=mine.length||other.length||outside.length
    ? (mine.length?"":`<option value="">Choose a session</option>`)+group("This project",mine)+group("Other sessions in this product",other)+group("Sessions outside any product",outside)
    : `<option value="">No open T3 session</option>`;
}

function apPost(action,body,onOk){
  fetch("api/autopilot"+Q,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action,...body})})
    .then(r=>r.json().catch(()=>({})).then(b=>{
      if(!r.ok)throw new Error(b.error||("HTTP "+r.status));

      render();

}

function apAdd(){
  const proj=$("#apAddProj").value,thread=$("#apAddThread").value,goal=$("#apAddGoal").value.trim();

    (DATA.autopilot.projects=DATA.autopilot.projects||[]).push({project:b.project||proj,thread:b.thread||thread,goal:b.goal||goal,every_hours:b.every_hours||every,enabled:!!b.enabled,max_per_day:b.max_per_day||4,last_nudge_at:b.last_nudge_at||null,history:b.history||[],state:st.state,stateLabel:st.stateLabel,idle_since:st.idle_since,tokens:st.tokens,last_result:null,last_result_at:null,next_due:null,nudge:b.enabled?"warm":"off"});

function apSave(){

  apPost("save",{project:apEditing,goal:goal,every_hours:every},b=>{

function apConfirmWaiting(pid,ids){
  apPendingSend=pid;
  $("#apConfirmText").textContent=ids&&ids.length?`The agent is waiting on your answer to ${ids.join(", ")}. Send anyway?`:"The agent is waiting on you. Send anyway?";
  $("#apConfirmDlg").showModal();
}
function apSendNow(pid){
  const p=apProject(pid);if(!p)return;
  if(p.state==="waiting"){apConfirmWaiting(pid,p.waitingOn);return}
  apDoSend(pid);
}
function apDoSend(pid,confirmed){
  const btn=document.querySelector(`[data-ap-send="${pid}"]`);
  const reenable=()=>{const b=document.querySelector(`[data-ap-send="${pid}"]`);if(b){b.disabled=false;b.innerHTML="Send now";}};
  if(btn){btn.style.minWidth=btn.offsetWidth+"px";btn.disabled=true;btn.innerHTML='<svg class="spin" width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="8" r="6" stroke-dasharray="10 16"/></svg>';}
  fetch("api/autopilot"+Q,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"send",project:pid,confirmed:!!confirmed})})
    .then(r=>r.json().catch(()=>({})).then(b=>{
      if(!r.ok)throw new Error(b.error||("HTTP "+r.status));
      // the row can be stale (added a moment ago): the server's answer decides the confirm
      if(!confirmed&&!b.delivered&&String(b.result||"").startsWith("skipped waiting on you")){
        reenable();apConfirmWaiting(pid,b.waitingOn);return}
      toast(b.delivered?"Nudge sent":`Not sent: ${b.result}`);
      render();
    }))
    .catch(err=>{toast("Not sent: "+err.message);reenable();});
}
function apPause(on){
  apPost(on?"pause":"resume",{},b=>{
    if(DATA.autopilot){DATA.autopilot.paused=b.paused;DATA.autopilot.pausedAt=b.pausedAt;}
    toast(on?"All automations paused":"Automations resumed");
  });
}
